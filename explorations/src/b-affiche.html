<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Exploration B — Affiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* EXPLORATION B — « Affiche », deuxième tour
   Références : « Portfolio Hero » d'Alex Kane (nom géant, portrait au centre des
   lettres, accent fluo) ; Project Index et Impact Experience (index à très gros
   titres) ; Experience Timeline (la ligne s'ouvre en place).

   Ce que ce tour ajoute :
   - les lettres du nom réagissent au pointeur : l'axe de chasse d'Archivo
     (62–125 %) et sa graisse varient avec la distance — c'est la police qui
     bouge, pas une image ;
   - la preuve chiffrée ouvre la page suivante, en très grand : un lecteur qui ne
     défile qu'une fois repart avec +83 % et sa base de comparaison ;
   - les titres de section se remplissent au défilement (CSS pur) ;
   - un panneau de réglages (en bas à droite) pour essayer l'accent, le
     traitement de la photo et le style des titres, sans toucher au code.

   Un seul accent, réglable. Le cuivre des preuves, lui, ne bouge pas. */
@property --w  { syntax:"<number>"; inherits:false; initial-value:125; }
@property --wg { syntax:"<number>"; inherits:false; initial-value:800; }
:root { --bg:#0a0a0a; --fg:#f2f2ee; --dim:#9a9da1; --line:#222; --acc:#c9ff2f; --hot:#ff9d63; --disp:"Archivo","Manrope",sans-serif; --e:cubic-bezier(.62,0,.24,1); }
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--fg); font:400 16px/1.6 "Manrope",sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
a { color:inherit; text-decoration:none; }
::selection { background:var(--acc); color:#000; }
.mono { font:500 12px/1.5 "JetBrains Mono",monospace; letter-spacing:.14em; text-transform:uppercase; }
.disp { font-family:var(--disp); font-stretch:125%; font-weight:800; text-transform:uppercase; }

/* ---------- Barre ---------- */
.top { position:fixed; inset:0 0 auto; display:flex; justify-content:space-between; padding:20px 28px 34px; z-index:20; color:#fff; pointer-events:none; background:linear-gradient(var(--bg) 52%, transparent); }
.top > * { pointer-events:auto; }
.top nav { display:flex; gap:22px; }

/* ---------- Affiche ---------- */
.hero { min-height:100vh; min-height:100dvh; display:grid; place-items:center; position:relative; padding:96px 0 90px; overflow:hidden; --px:0; --py:0; }
.name { font-family:var(--disp); text-transform:uppercase; color:var(--acc); line-height:.8; letter-spacing:-.035em; font-size:clamp(54px,16.2vw,300px); text-align:center; position:relative; white-space:nowrap; }
.name .w { display:block; }
.name .l { display:inline-block; font-variation-settings:"wdth" var(--w), "wght" var(--wg); transition:--w .35s var(--e), --wg .35s var(--e); }
.photo { position:absolute; left:50%; top:50%; width:clamp(120px,19vw,300px); aspect-ratio:1; border-radius:50%; overflow:hidden; z-index:3; box-shadow:0 0 0 6px var(--bg);
  transform:translate(calc(-50% + var(--px) * 22px), calc(-52% + var(--py) * 22px)); transition:transform .5s var(--e); }
/* Bichromie : la photo passe en niveaux de gris, puis la couleur du lettrage est
   multipliée dessus — le noir reste noir, le blanc devient exactement la couleur
   de l'accent. Changer l'accent change donc la photo avec lui. */
.photo img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1) contrast(1.2) brightness(1.12); }
.photo::after { content:""; position:absolute; inset:0; background:var(--acc); mix-blend-mode:multiply; opacity:1; }
[data-photo="nb"] .photo::after { display:none; }
[data-photo="couleur"] .photo::after { display:none; }
[data-photo="couleur"] .photo img { filter:none; }
[data-photo="off"] .photo { display:none; }
.tag { position:absolute; bottom:44px; left:0; right:0; text-align:center; color:var(--dim); z-index:4; padding:0 20px; }
.tag b { color:var(--fg); font-weight:500; }
.arrow { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); font-size:18px; color:var(--dim); animation:bob 2.2s ease-in-out infinite; }
@keyframes bob { 50% { transform:translate(-50%,6px); } }

/* Téléphone : pas de pointeur, donc les lettres respirent d'elles-mêmes — peu,
   pour que le nom ne change pas de largeur d'un tiers. */
@keyframes breathe { 0%,100% { --w:var(--w0); --wg:800; } 50% { --w:calc(var(--w0) + 14); --wg:680; } }
@media (hover:none), (max-width:760px) {
  .name { --w0:76; font-size:min(23vw, 150px); }
  .name .l { --w:var(--w0); animation:breathe 6s ease-in-out infinite; animation-delay:calc(var(--i) * .16s); }
  .photo { top:auto; bottom:128px; width:min(34vw,150px); transform:translate(-50%,0); }
  .hero { padding-bottom:130px; }
}

/* ---------- Bandeau ---------- */
.ticker { background:var(--acc); color:#000; overflow:hidden; white-space:nowrap; padding:14px 0; }
.ticker div { display:inline-block; animation:tick 40s linear infinite; font:800 clamp(18px,2.4vw,30px)/1 var(--disp); font-stretch:125%; text-transform:uppercase; letter-spacing:-.01em; }
.ticker span { margin:0 28px; }
@keyframes tick { to { transform:translateX(-50%); } }

/* ---------- Sections ---------- */
main { padding:0 28px; max-width:1500px; margin:0 auto; }
.sec { padding:140px 0 0; }
.sh { display:flex; gap:14px; color:var(--dim); margin-bottom:6px; }
.sec > h2 { font:800 clamp(30px,8vw,128px)/.9 var(--disp); font-stretch:125%; text-transform:uppercase; letter-spacing:-.04em; margin-bottom:46px;
  color:transparent; -webkit-text-stroke:1.5px var(--acc); }
[data-titles="plein"] .sec > h2 { color:var(--acc); -webkit-text-stroke:0; }
@supports (animation-timeline:view()) {
  [data-titles="contour"] .sec > h2 { background:linear-gradient(var(--acc),var(--acc)) no-repeat 0 0 / 0% 100%; -webkit-background-clip:text; background-clip:text; animation:fill linear both; animation-timeline:view(); animation-range:entry 25% cover 38%; }
  @keyframes fill { to { background-size:100% 100%; } }
}
/* Repli : les navigateurs sans `animation-timeline` reçoivent la même progression
   par script (--p, de 0 à 1). Même rendu, même plage. */
.no-timeline[data-titles="contour"] .sec > h2 { background:linear-gradient(var(--acc),var(--acc)) no-repeat 0 0 / calc(var(--p,0) * 100%) 100%; -webkit-background-clip:text; background-clip:text; }
/* Mouvement réduit : pas de remplissage progressif, le titre est plein. */
@media (prefers-reduced-motion:reduce) {
  .sec > h2 { color:var(--acc) !important; -webkit-text-stroke:0 !important; background:none !important; animation:none !important; }
}
details { border-top:1px solid var(--line); position:relative; }
details:last-of-type { border-bottom:1px solid var(--line); }
summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:minmax(96px,10%) 1fr auto 28px; gap:18px; align-items:baseline; padding:22px 0; transition:padding .35s var(--e), color .2s; position:relative; }
summary::-webkit-details-marker { display:none; }
summary::before { content:""; position:absolute; left:0; bottom:-1px; height:2px; width:0; background:var(--acc); transition:width .55s var(--e); }
summary:hover::before, details[open] > summary::before { width:100%; }
summary:focus-visible, .tweaks button:focus-visible, .contact a:focus-visible, .top a:focus-visible { outline:2px solid var(--acc); outline-offset:4px; }
summary .n { color:var(--dim); }
summary .t { font:800 clamp(26px,5.2vw,76px)/.98 var(--disp); font-stretch:125%; text-transform:uppercase; letter-spacing:-.03em; }
summary .t small { display:block; font:500 12px/1.5 "JetBrains Mono",monospace; letter-spacing:.14em; color:var(--dim); margin-top:10px; }
summary .s { color:var(--dim); text-align:right; max-width:30ch; font-size:14px; }
summary .pm { font:500 22px/1 "JetBrains Mono",monospace; color:var(--dim); text-align:right; transition:transform .35s var(--e), color .2s; }
summary:hover { color:var(--acc); padding-left:14px; }
summary:hover .pm, details[open] .pm { color:var(--acc); }
details[open] > summary { color:var(--acc); }
details[open] .pm { transform:rotate(45deg); }
.body { display:grid; grid-template-columns:minmax(96px,10%) 1fr; gap:18px; padding:6px 0 48px; animation:open .5s var(--e); }
@keyframes open { from { opacity:0; transform:translateY(-10px); } }
.body .in { max-width:84ch; display:grid; gap:12px; color:#d6d7d4; }
.body ul { list-style:none; display:grid; gap:10px; }
.body li { padding-left:22px; position:relative; }
.body li::before { content:"→"; position:absolute; left:0; color:var(--acc); }
.lab { color:var(--dim); margin-top:10px; }
/* La preuve est un fait du poste, pas un titre : une pastille discrète sur la ligne
   fermée, et un paragraphe sobre dans la fiche, avec sa base de comparaison. */
.pchip { font:500 12px/1.4 "JetBrains Mono",monospace; letter-spacing:.06em; color:var(--hot); white-space:nowrap; }
.pf { border-left:2px solid var(--hot); padding-left:14px; display:grid; gap:4px; }
.pf b { color:var(--hot); font-weight:700; }
.pf small { color:var(--dim); font-size:13.5px; }
.pf a { color:var(--acc); text-decoration:underline; text-underline-offset:3px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chips span { border:1px solid #333; border-radius:99px; padding:3px 12px; font:500 12px/1.6 "JetBrains Mono",monospace; letter-spacing:.06em; color:var(--dim); }
.big { font:800 clamp(30px,6vw,88px)/1.02 var(--disp); font-stretch:125%; letter-spacing:-.03em; text-transform:uppercase; padding:70px 0 10px; max-width:18ch; }
.big em { font-style:normal; color:var(--acc); }
.contact { margin:150px 0 0; padding:36px 0 110px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:20px; }
.contact a { font:800 clamp(38px,10vw,150px)/.9 var(--disp); font-stretch:125%; text-transform:uppercase; letter-spacing:-.04em; color:var(--acc); transition:letter-spacing .5s var(--e), color .2s; }
.contact a:hover { color:var(--fg); letter-spacing:-.02em; }

/* ---------- Réglages ---------- */
.tweaks { position:fixed; right:14px; bottom:14px; z-index:40; background:rgba(18,18,18,.86); backdrop-filter:blur(14px); border:1px solid #2c2c2c; border-radius:16px; padding:10px 12px; display:grid; gap:8px; font-size:10.5px; max-width:calc(100vw - 28px); }
.tweaks[data-closed="true"] .rows { display:none; }
.tweaks .hd { display:flex; justify-content:space-between; gap:18px; cursor:pointer; color:var(--dim); }
.tweaks .r { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tweaks .r > span { color:var(--dim); width:56px; }
.tweaks button { font:inherit; letter-spacing:inherit; text-transform:inherit; background:none; color:var(--fg); border:1px solid #333; border-radius:99px; padding:3px 10px; cursor:pointer; }
.tweaks button[aria-pressed="true"] { background:var(--fg); color:#000; border-color:var(--fg); }
.tweaks .sw { width:18px; height:18px; padding:0; border-radius:50%; border:2px solid #333; }
.tweaks .sw[aria-pressed="true"] { border-color:#fff; }

@media (max-width:760px) {
  .top nav { display:none; }
  summary { grid-template-columns:1fr 28px; }
  summary .n, summary .s { display:none; }
  .body { grid-template-columns:1fr; }
  .body > span { display:none; }
    .tweaks { right:10px; bottom:10px; }
}
@media (prefers-reduced-motion:reduce) {
  .ticker div, .arrow, .name .l { animation:none !important; }
  .body, summary::before, .photo { animation:none; transition:none; }
  html { scroll-behavior:auto; }
}
</style>
</head>
<body data-photo="duo" data-titles="contour">
<div class="top mono"><span id="brand"></span><nav id="nav"></nav></div>

<header class="hero" id="hero">
  <h1 class="name disp" id="name"></h1>
  <div class="photo"><img id="photo" alt="Portrait de Jérémy Ribes" /></div>
  <p class="tag mono" id="tag"></p>
  <div class="arrow" aria-hidden="true">↓</div>
</header>

<div class="ticker" aria-hidden="true"><div id="ticker"></div></div>
<main id="doc"></main>

<aside class="tweaks mono" id="tweaks" data-closed="false" aria-label="Réglages de l’exploration">
  <div class="hd" id="tw-hd"><span>Réglages</span><span id="tw-x">−</span></div>
  <div class="rows">
    <div class="r"><span>Accent</span><button class="sw" data-k="acc" data-v="fluo" style="background:#c9ff2f" aria-label="Fluo"></button><button class="sw" data-k="acc" data-v="cuivre" style="background:#ff9d63" aria-label="Cuivre"></button><button class="sw" data-k="acc" data-v="glace" style="background:#cfe3ff" aria-label="Glace"></button><button class="sw" data-k="acc" data-v="blanc" style="background:#f2f2ee" aria-label="Blanc"></button></div>
    <div class="r"><span>Photo</span><button data-k="photo" data-v="duo">Duo</button><button data-k="photo" data-v="nb">N&amp;B</button><button data-k="photo" data-v="couleur">Couleur</button><button data-k="photo" data-v="off">Aucune</button></div>
    <div class="r"><span>Titres</span><button data-k="titles" data-v="contour">Contour</button><button data-k="titles" data-v="plein">Plein</button></div>
  </div>
</aside>

<script>/*__CV__*/</script>
<script>
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n + 1).padStart(2, "0");
const C = window.CV;
const [first, ...rest] = C.contact.name.split(" ");

/* ---- le nom : chaque lettre est un élément, pour que la police puisse bouger ---- */
let li = 0;
const word = (w) => `<span class="w" aria-hidden="true">${[...w].map((c) => `<span class="l" style="--i:${li++}">${c}</span>`).join("")}</span>`;
$("#name").setAttribute("aria-label", C.contact.name);
$("#name").innerHTML = word(first) + word(rest.join(" "));
$("#brand").textContent = C.contact.name;
$("#photo").src = window.PHOTO;
$("#tag").innerHTML = `<b>${C.contact.role}</b><br>${C.contact.secondaryRole.split(" · ")[0]}`;
const items = C.contact.secondaryRole.split(" · ");
$("#ticker").innerHTML = [...items, ...items, ...items, ...items].map((t) => `<span>${t}</span>`).join("✦");
const nav = [["Expériences", "experiences"], ["Outils", "outils"], ["Projets", "projets"], ["Compétences", "competences"], ["Formation", "formation"]];
$("#nav").innerHTML = nav.map(([l, id]) => `<a href="#${id}">${l}</a>`).join("");

/* ---- le document ---- */
const row = (n, title, sub, side, body, id) => `<details${id ? ` id="${id}"` : ""}><summary><span class="n mono">${n}</span><span class="t">${title}${sub ? `<small>${sub}</small>` : ""}</span><span class="s">${side || ""}</span><span class="pm">+</span></summary><div class="body"><span></span><div class="in">${body}</div></div></details>`;
const lab = (t) => `<div class="lab mono">${t}</div>`;
const sec = (id, n, title, count, inner) => `<section class="sec" id="${id}"><div class="sh mono"><span>${n}</span><span>${count}</span></div><h2>${title}</h2>${inner}</section>`;

const statsText = (e) => e.stats.map((x) => x.value + (x.label ? " " + x.label : ""));
const expId = (e) => "exp-" + e.id;
const exp = C.experiences.map((e) => {
  const stats = e.stats ? `<p class="pf"><span>${statsText(e).map((t) => `<b>${t}</b>`).join(" · ")}</span><small>${e.statsLabel} — ${e.statsBase}</small></p>` : "";
  const chip = e.stats ? `<span class="pchip">${statsText(e).join(" · ")}</span>` : "";
  return row(e.date, e.company, e.role, chip, `${e.context ? `<p>${e.context}</p>` : ""}<ul>${e.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>${stats}${e.result ? `<p>${e.result}</p>` : ""}`, expId(e));
}).join("");

/* Opti'Profit a été conçu et utilisé pendant le poste de Générale d'Optique. Le
   chiffre du poste est rappelé comme CONTEXTE : les données disent que relance,
   équipe et réorganisation ont joué ensemble, donc il n'est pas présenté comme
   le résultat de l'outil. */
const opti = C.experiences.find((e) => e.stats);
const ctxOpti = (o) => o.id === "optiprofit" && opti ? `${lab("Contexte mesuré")}<div class="pf"><span>Poste où il a servi : <a href="#${expId(opti)}" data-open="${expId(opti)}">${opti.company}, ${opti.date} ↗</a></span><span>${opti.statsLabel} ${statsText(opti).map((t) => `<b>${t}</b>`).join(" · ")}.</span><small>${opti.statsBase} Plusieurs actions ont joué ensemble : l’outil n’explique pas l’écart à lui seul.</small></div>` : "";
const out = C.outils.map((o, i) => row(pad(i), o.title, o.category, o.status,
  `<p>${o.summary}</p>${lab("Situation")}<p>${o.context}</p>${o.arbitrage ? lab("Décision") + `<p>${o.arbitrage}</p>` : ""}${lab("Réponse")}<p>${o.action}</p>${lab("Résultat")}<p>${o.results}</p>${ctxOpti(o)}<div class="chips">${o.chips.map((c) => `<span>${c}</span>`).join("")}</div>${o.link ? `<p><a style="color:var(--acc)" href="${o.link.url}">${o.link.label} ↗</a></p>` : ""}`)).join("");

const prj = C.projets.map((p, i) => row(pad(i), p.short, p.subtitle, "",
  `<ul>${p.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>${lab("Compétences transférables")}<ul>${p.transferableSkills.map((t) => `<li><b>${t.title}</b> — ${t.text}</li>`).join("")}</ul>${p.link ? `<p><a style="color:var(--acc)" href="${p.link.url}">${p.link.label} ↗</a></p>` : ""}`)).join("");

const comp = C.competences.map((c, i) => row(pad(i), c.title, "", c.summary,
  `${lab("Enjeu traité")}<p>${c.enjeu}</p>${lab("Ce que j’ai mis en place")}<p>${c.miseEnPlace}</p>${lab("Exemple concret")}<p>${c.exemple}</p>${lab("Résultat observable")}<p>${c.resultat}</p><div class="chips">${c.tags.map((t) => `<span>${t}</span>`).join("")}</div>`)).join("");

const f = C.formation;
const form = row(f.year, f.title, f.subtitle, "", "<p>" + f.continuousSkills.map((s) => `<b>${s.title}</b> — ${s.text}`).join("</p><p>") + "</p>") + `<p class="big">${f.quote.replace("problèmes", "<em>problèmes</em>")}</p>`;

$("#doc").innerHTML =
  `<p class="big">${C.profile.quote.replace("plus lisible", "<em>plus lisible</em>")}</p>` +
  sec("experiences", "01", "Expériences", `${C.experiences.length} postes`, exp) + sec("outils", "02", "Outils", `${C.outils.length} outils`, out) + sec("projets", "03", "Projets", `${C.projets.length} projets`, prj) + sec("competences", "04", "Compétences", `${C.competences.length} domaines`, comp) + sec("formation", "05", "Formation", f.year, form) +
  `<div class="contact"><a href="${C.contact.site.url}">Me contacter ↗</a><span class="mono" style="color:var(--dim)">${C.contact.name}<br>${C.contact.items[0].text}</span></div>`;

/* ---- « Voir le poste » : ouvre la fiche visée avant d'y aller ---- */
document.querySelectorAll("a[data-open]").forEach((a) => a.addEventListener("click", (ev) => {
  ev.preventDefault(); const d = document.getElementById(a.dataset.open); if (!d) return;
  d.open = true; d.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
}));

/* ---- les lettres suivent le pointeur ----
   Distance au curseur → axe de chasse et graisse. Les centres sont mesurés une
   fois au repos (et au redimensionnement) : mesurés pendant l'animation, ils
   bougeraient avec elle et la lettre courrait après son propre centre. */
const letters = [...document.querySelectorAll(".name .l")];
const hero = $("#hero");
let centers = [], raf = 0, mx = -1e5, my = -1e5;
const canMove = matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches;
function measure() { centers = letters.map((l) => { const r = l.getBoundingClientRect(); return [r.left + r.width / 2 + scrollX, r.top + r.height / 2 + scrollY]; }); }
function tick() {
  raf = 0; const R = innerWidth * 0.2;
  letters.forEach((l, i) => {
    const [cx, cy] = centers[i], t = Math.max(0, 1 - Math.hypot(mx + scrollX - cx, my + scrollY - cy) / R);
    l.style.setProperty("--w", (125 - 52 * t).toFixed(0)); l.style.setProperty("--wg", (800 - 340 * t).toFixed(0));
  });
}
if (canMove) {
  document.fonts.ready.then(measure); addEventListener("resize", measure);
  hero.addEventListener("pointermove", (e) => { if (e.pointerType !== "mouse") return; mx = e.clientX; my = e.clientY; hero.style.setProperty("--px", ((e.clientX / innerWidth) - .5) * 2); hero.style.setProperty("--py", ((e.clientY / innerHeight) - .5) * 2); if (!raf) raf = requestAnimationFrame(tick); });
  hero.addEventListener("pointerleave", () => { mx = my = -1e5; hero.style.setProperty("--px", 0); hero.style.setProperty("--py", 0); if (!raf) raf = requestAnimationFrame(tick); });
}

/* ---- remplissage des titres : repli sans animation-timeline ---- */
if (!CSS.supports("animation-timeline: view()")) {
  document.documentElement.classList.add("no-timeline");
  const hs = [...document.querySelectorAll(".sec > h2")];
  const upd = () => hs.forEach((h) => { const r = h.getBoundingClientRect(), vh = innerHeight; const p = Math.min(1, Math.max(0, (vh * 0.9 - r.top) / (vh * 0.38))); h.style.setProperty("--p", p.toFixed(3)); });
  addEventListener("scroll", () => requestAnimationFrame(upd), { passive: true }); addEventListener("resize", upd); upd();
}

/* ---- réglages ---- */
const ACC = { fluo: "#c9ff2f", cuivre: "#ff9d63", glace: "#cfe3ff", blanc: "#f2f2ee" };
let T = { acc: "fluo", photo: "duo", titles: "contour" };
try { Object.assign(T, JSON.parse(localStorage.getItem("b-reglages-3") || "{}")); } catch (e) {}
const q = new URLSearchParams(location.search); for (const k of ["acc", "photo", "titles"]) if (q.get(k)) T[k] = q.get(k);
function apply() {
  document.documentElement.style.setProperty("--acc", ACC[T.acc] || ACC.fluo);
  document.body.dataset.photo = T.photo; document.body.dataset.titles = T.titles;
  document.querySelectorAll(".tweaks button").forEach((b) => b.setAttribute("aria-pressed", String(T[b.dataset.k] === b.dataset.v)));
  try { localStorage.setItem("b-reglages-3", JSON.stringify(T)); } catch (e) {}
}
document.querySelectorAll(".tweaks button").forEach((b) => b.addEventListener("click", () => { T[b.dataset.k] = b.dataset.v; apply(); }));
if (innerWidth < 760) { $("#tweaks").dataset.closed = "true"; $("#tw-x").textContent = "+"; }
$("#tw-hd").addEventListener("click", () => { const t = $("#tweaks"); const c = t.dataset.closed === "true"; t.dataset.closed = String(!c); $("#tw-x").textContent = c ? "−" : "+"; });
apply();
</script>
</body>
</html>
