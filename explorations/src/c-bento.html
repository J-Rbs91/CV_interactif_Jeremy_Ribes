<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exploration C — Bento en verre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* EXPLORATION C — « Bento en verre »
   Références : « Glassmorphism Portfolio » de Moumen Soliman (carte profil à
   liens animés, sections en verre), « Ruixen Card » (carte de profil), « Impact
   Experience » (une ligne par employeur, détails à droite) et « Skills
   Showcase » (liste qu'on survole pour l'explorer).
   La page n'a plus de colonne latérale : une barre en haut, puis une grille de
   blocs. Clair, un seul fond, des lueurs sous le pointeur.
   Aucun niveau de compétence n'est affiché : les données n'en portent pas, et
   une barre à 90 % serait un chiffre inventé. */
:root { --bg:#eceae4; --ink:#0b1f33; --ink2:#40566a; --mut:#4a5d70; --line:rgba(11,31,51,.12); --hot:#b9531c; --glass:linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,.48)); --edge:rgba(255,255,255,.85); --disp:"Archivo","Manrope",sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { color:var(--ink); font:400 15px/1.6 "Manrope", sans-serif; background:
  radial-gradient(60% 50% at 12% 0%, rgba(255,255,255,.9), transparent 70%),
  radial-gradient(50% 45% at 100% 20%, rgba(190,200,215,.55), transparent 70%),
  linear-gradient(170deg, #f1efea, #e6e3dc 60%, #dedbd3); background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
.mono { font:500 11px/1.4 "JetBrains Mono", monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); }

/* ---------- Barre ---------- */
.bar { position:sticky; top:14px; z-index:30; max-width:1240px; margin:14px auto 0; padding:10px 14px 10px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--glass); border:1px solid var(--edge); border-radius:999px; backdrop-filter:blur(18px) saturate(1.2); box-shadow:0 10px 30px rgba(11,31,51,.08); }
.bar b { font:800 14px/1 var(--disp); font-stretch:125%; letter-spacing:-.01em; }
.bar nav { display:flex; gap:4px; }
.bar nav a { padding:7px 13px; border-radius:99px; font-weight:600; font-size:13px; color:var(--ink2); transition:background .2s, color .2s; }
.bar nav a:hover { background:rgba(11,31,51,.07); color:var(--ink); }
.btn { background:var(--ink); color:#fff; padding:9px 18px; border-radius:99px; font-weight:700; font-size:13px; }
.btn:hover { background:#1d3d5c; }

/* ---------- Grille ---------- */
main { max-width:1240px; margin:26px auto 0; padding:0 14px 90px; display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
.card { position:relative; isolation:isolate; padding:28px; background:var(--glass); border:1px solid var(--edge); border-radius:26px; backdrop-filter:blur(16px) saturate(1.15); box-shadow:inset 0 1px 0 #fff, 0 16px 40px rgba(11,31,51,.08); overflow:hidden; }
.card::before { content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity .35s; background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.95), rgba(255,255,255,0) 70%); }
.card:hover::before { opacity:1; }
.c8{grid-column:span 8} .c7{grid-column:span 7} .c6{grid-column:span 6} .c5{grid-column:span 5} .c4{grid-column:span 4} .c12{grid-column:span 12}
h2 { font:800 13px/1 var(--disp); font-stretch:125%; letter-spacing:.02em; margin-bottom:20px; display:flex; justify-content:space-between; align-items:baseline; }
h2 small { font:500 11px/1 "JetBrains Mono", monospace; letter-spacing:.12em; color:var(--mut); text-transform:uppercase; }

/* Héros : la citation + la carte profil */
.hero h1 { font:800 clamp(34px, 4.6vw, 62px)/1.04 var(--disp); font-stretch:125%; letter-spacing:-.035em; max-width:16ch; margin:14px 0 22px; }
.hero .lead { max-width:58ch; color:var(--ink2); font-size:16px; }
.hero .lead strong { color:var(--ink); }
.facts { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:28px; }
.fact { background:rgba(255,255,255,.5); border:1px solid var(--edge); border-radius:18px; padding:16px; }
.fact b { display:block; font:800 14px/1.2 var(--disp); font-stretch:125%; margin-bottom:6px; }
.fact p { font-size:13px; color:var(--ink2); line-height:1.5; }

.me { text-align:center; display:flex; flex-direction:column; align-items:center; }
.me img { width:112px; height:112px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 3px #fff, 0 0 0 5px rgba(11,31,51,.12), 0 14px 30px rgba(11,31,51,.2); }
.me h3 { font:800 21px/1.1 var(--disp); font-stretch:125%; letter-spacing:-.02em; margin:18px 0 4px; }
.me .sub { font-size:13px; color:var(--ink2); max-width:28ch; margin-top:10px; }
.links { width:100%; display:grid; gap:8px; margin-top:22px; text-align:left; }
.links a { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,.55); border:1px solid var(--edge); border-radius:16px; padding:11px 15px; transition:transform .25s cubic-bezier(.62,0,.24,1), background .2s; }
.links a:hover { transform:translateX(5px); background:#fff; }
.links b { display:block; font-weight:700; font-size:14px; }
.links span { font-size:12px; color:var(--mut); }

/* Listes */
.list details { border-top:1px solid var(--line); }
.list details:first-of-type { border-top:0; }
.list summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:3px 14px; padding:15px 0; align-items:baseline; }
.list summary::-webkit-details-marker { display:none; }
.list summary .t { font:800 clamp(20px, 2.1vw, 28px)/1.1 var(--disp); font-stretch:125%; letter-spacing:-.025em; transition:transform .25s cubic-bezier(.62,0,.24,1); }
.list summary:hover .t { transform:translateX(6px); }
.list summary .d { text-align:right; }
.list summary .r { grid-column:1/-1; font-size:13px; color:var(--ink2); }
.list .body { padding:2px 0 22px; display:grid; gap:12px; color:var(--ink2); max-width:70ch; }
.list .body ul { list-style:none; display:grid; gap:9px; }
.list .body li { padding-left:18px; position:relative; }
.list .body li::before { content:"›"; position:absolute; left:2px; font-weight:800; color:var(--ink); }
.lab { margin-top:6px; }
.proof { display:flex; gap:30px; font:800 34px/1 var(--disp); font-stretch:125%; color:var(--hot); letter-spacing:-.03em; }
.proof small { display:block; font:500 11px/1.4 "JetBrains Mono", monospace; letter-spacing:.12em; color:var(--mut); margin-top:5px; text-transform:uppercase; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips span { background:rgba(11,31,51,.06); border-radius:99px; padding:3px 11px; font-size:12px; font-weight:600; color:var(--ink2); }

/* Outils : grille */
.tools { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.tool { position:relative; background:rgba(255,255,255,.55); border:1px solid var(--edge); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:8px; transition:transform .3s cubic-bezier(.62,0,.24,1), background .2s, box-shadow .3s; }
.tool:hover { transform:translateY(-4px); background:#fff; box-shadow:0 18px 36px rgba(11,31,51,.12); }
.tool .n { font:800 30px/1 var(--disp); font-stretch:125%; color:rgba(11,31,51,.18); }
.tool h3 { font:800 18px/1.15 var(--disp); font-stretch:125%; letter-spacing:-.02em; }
.tool p { font-size:13.5px; color:var(--ink2); }
.tool .st { margin-top:auto; padding-top:10px; border-top:1px solid var(--line); font-size:12.5px; font-weight:600; }
.tool details summary { cursor:pointer; list-style:none; color:var(--ink); font-weight:700; font-size:12.5px; margin-top:4px; }
.tool details summary::-webkit-details-marker { display:none; }
.tool details[open] summary { margin-bottom:8px; }
.tool .more { display:grid; gap:8px; font-size:13px; color:var(--ink2); }

.skills a { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); font-weight:700; }
.skills a:first-child { border-top:0; }
.skills small { display:block; font-weight:500; font-size:12.5px; color:var(--ink2); }
.skills a:hover b { transform:translateX(5px); }
.skills b { transition:transform .25s; display:inline-block; }

footer { max-width:1240px; margin:0 auto; padding:0 14px 50px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

@media (max-width: 960px) {
  .c8,.c7,.c6,.c5,.c4 { grid-column:span 12; }
  .tools { grid-template-columns:1fr 1fr; }
  .facts { grid-template-columns:1fr; }
}
@media (max-width: 620px) {
  .bar nav { display:none; }
  .tools { grid-template-columns:1fr; }
  .card { padding:22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } html { scroll-behavior:auto; } }
</style>
</head>
<body>
<div class="bar"><b id="brand"></b><nav id="nav"></nav><a class="btn" id="cta">Me contacter</a></div>

<main id="main"></main>
<footer class="mono"><span id="foot"></span><span id="foot2"></span></footer>

<script>/*__CV__*/</script>
<script>
const $ = (s) => document.querySelector(s);
const C = window.CV, P = C.profile;
const pad = (n) => String(n + 1).padStart(2, "0");
const live = [...C.outils.filter((o) => o.link && o.liveProduct !== false).map((o) => ({ n: o.title, ...o.link })), ...C.projets.filter((p) => p.link).map((p) => ({ n: p.short, ...p.link }))];
const host = (u) => new URL(u).host.replace(/^www\./, "");

$("#brand").textContent = C.contact.name;
$("#cta").href = C.contact.site.url;
const nav = [["Parcours", "parcours"], ["Outils", "outils"], ["Projets", "projets"], ["Compétences", "competences"], ["Formation", "formation"]];
$("#nav").innerHTML = nav.map(([l, id]) => `<a href="#${id}">${l}</a>`).join("");
$("#foot").textContent = `${C.contact.name} — ${C.contact.items[0].text}`;
$("#foot2").textContent = C.contact.site.host;

const hero = `
<section class="card hero c8">
  <span class="mono">Profil · Positionnement & méthode</span>
  <h1>${P.quote}</h1>
  <p class="lead">${P.intro}</p>
  <div class="facts">${P.cards.map((c) => `<div class="fact"><b>${c.title}</b><p>${c.text}</p></div>`).join("")}<div class="fact"><b>Expertise clé</b><p>${P.expertise}</p></div></div>
</section>
<aside class="card me c4">
  <img src="${window.PHOTO}" alt="Portrait de ${C.contact.name}" />
  <h3>${C.contact.name}</h3>
  <span class="mono">${C.contact.role}</span>
  <p class="sub">${C.contact.secondaryRole.split(" · ").join(" · ")}</p>
  <div class="links">${live.map((l) => `<a href="${l.url}"><div><b>${l.n}</b><span>${host(l.url)}</span></div><span>↗</span></a>`).join("")}<a href="${C.contact.site.url}"><div><b>Me contacter</b><span>Formulaire, sur le site</span></div><span>→</span></a></div>
</aside>`;

const exp = `<section class="card list c7" id="parcours"><h2>Parcours<small>${C.experiences.length} postes · 14 ans</small></h2>${C.experiences.map((e) => {
  const stats = e.stats ? `<div class="proof">${e.stats.map((s) => `<div>${s.value}${s.label ? `<small>${s.label}</small>` : ""}</div>`).join("")}</div><p class="mono" style="text-transform:none;letter-spacing:.02em">${e.statsLabel} — ${e.statsBase}</p>` : "";
  return `<details><summary><span class="t">${e.company}</span><span class="d mono">${e.date}</span><span class="r">${e.role}</span></summary><div class="body">${e.context ? `<p>${e.context}</p>` : ""}<ul>${e.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>${stats}${e.result ? `<p><b style="color:var(--ink)">${e.result}</b></p>` : ""}</div></details>`;
}).join("")}</section>`;

const proofs = C.experiences.find((e) => e.stats);
const stat = `<section class="card c5" style="display:flex;flex-direction:column;justify-content:space-between"><h2>Preuve<small>mesurée</small></h2><div class="proof" style="font-size:clamp(40px,5vw,64px);flex-direction:column;gap:18px">${proofs.stats.map((s) => `<div>${s.value}${s.label ? `<small>${s.label}</small>` : ""}</div>`).join("")}</div><p style="font-size:13px;color:var(--ink2);margin-top:22px">${proofs.statsLabel} — ${proofs.statsBase}</p></section>`;

const tools = `<section class="card c12" id="outils"><h2>Outils<small>conçus, déployés, en usage</small></h2><div class="tools">${C.outils.map((o, i) => `<article class="tool"><span class="n">${pad(i)}</span><h3>${o.title}</h3><span class="mono">${o.category}</span><p>${o.summary}</p><details><summary>${o.detailLabel} ＋</summary><div class="more"><div><b>Situation.</b> ${o.context}</div>${o.arbitrage ? `<div><b>Décision.</b> ${o.arbitrage}</div>` : ""}<div><b>Réponse.</b> ${o.action}</div><div><b>Résultat.</b> ${o.results}</div><div class="chips">${o.chips.map((c) => `<span>${c}</span>`).join("")}</div></div></details><span class="st">${o.status}</span></article>`).join("")}</div></section>`;

const prj = `<section class="card list c12" id="projets"><h2>Projets transverses<small>${C.projets.length}</small></h2>${C.projets.map((p, i) => `<details><summary><span class="t">${p.short}</span><span class="d mono">${pad(i)}</span><span class="r">${p.subtitle}</span></summary><div class="body"><ul>${p.bullets.map((b) => `<li>${b}</li>`).join("")}</ul><div class="mono lab">Compétences transférables</div><ul>${p.transferableSkills.map((t) => `<li><b style="color:var(--ink)">${t.title}</b> — ${t.text}</li>`).join("")}</ul>${p.link ? `<p><a style="font-weight:800;text-decoration:underline" href="${p.link.url}">${p.link.label} ↗</a></p>` : ""}</div></details>`).join("")}</section>`;

const comp = `<section class="card list c7" id="competences"><h2>Compétences<small>${C.competences.length} domaines</small></h2>${C.competences.map((c) => `<details><summary><span class="t" style="font-size:clamp(17px,1.8vw,23px)">${c.title}</span><span class="r">${c.summary}</span></summary><div class="body"><div class="mono lab">Enjeu traité</div><p>${c.enjeu}</p><div class="mono lab">Ce que j’ai mis en place</div><p>${c.miseEnPlace}</p><div class="mono lab">Exemple concret</div><p>${c.exemple}</p><div class="mono lab">Résultat observable</div><p>${c.resultat}</p><div class="chips">${c.tags.map((t) => `<span>${t}</span>`).join("")}</div></div></details>`).join("")}</section>`;

const f = C.formation;
const form = `<section class="card c5 skills" id="formation"><h2>Formation<small>${f.year}</small></h2><div style="font:800 22px/1.15 var(--disp);font-stretch:125%;letter-spacing:-.02em">${f.title}</div><p class="mono" style="margin:6px 0 18px">${f.subtitle}</p>${f.continuousSkills.map((s) => `<a><span><b>${s.title}</b><small>${s.text}</small></span></a>`).join("")}<p style="margin-top:16px;font-weight:700">${f.quote}</p></section>`;

$("#main").innerHTML = hero + exp + stat + tools + prj + comp + form;

/* La lueur sous le pointeur : deux propriétés par image, souris seulement. */
if (matchMedia("(hover:hover) and (pointer:fine)").matches) document.querySelectorAll(".card").forEach((c) => {
  let raf = 0;
  c.addEventListener("pointermove", (e) => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; const b = c.getBoundingClientRect(); c.style.setProperty("--mx", e.clientX - b.left + "px"); c.style.setProperty("--my", e.clientY - b.top + "px"); }); });
});
</script>
</body>
</html>
