<!doctype html>
<html lang="fr" class="intro-wait">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Exploration B — Affiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* EXPLORATION B — « Affiche », deuxième tour
   Références : « Portfolio Hero » d'Alex Kane (nom géant, portrait au centre des
   lettres, accent fluo) ; Project Index et Impact Experience (index à très gros
   titres) ; Experience Timeline (la ligne s'ouvre en place).

   Ce que ce tour ajoute :
   - les lettres du nom réagissent au pointeur : l'axe de chasse d'Archivo
     (62–125 %) et sa graisse varient avec la distance — c'est la police qui
     bouge, pas une image ;
   - la preuve chiffrée ouvre la page suivante, en très grand : un lecteur qui ne
     défile qu'une fois repart avec +83 % et sa base de comparaison ;
   - les titres de section se remplissent au défilement (CSS pur) ;
   - un panneau de réglages (en bas à droite) pour essayer l'accent, le
     traitement de la photo et le style des titres, sans toucher au code.

   Un seul accent, réglable. Le cuivre des preuves, lui, ne bouge pas. */
@property --w  { syntax:"<number>"; inherits:false; initial-value:125; }
@property --wg { syntax:"<number>"; inherits:false; initial-value:800; }
:root { --bg:#0a0a0a; --fg:#f2f2ee; --dim:#9a9da1; --line:#222; --acc:#c9ff2f; --hot:#ff9d63; --disp:"Archivo","Manrope",sans-serif; --e:cubic-bezier(.62,0,.24,1); }
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--fg); font:400 16px/1.6 "Manrope",sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
a { color:inherit; text-decoration:none; }
::selection { background:var(--acc); color:#000; }
.mono { font:500 12px/1.5 "JetBrains Mono",monospace; letter-spacing:.14em; text-transform:uppercase; }
.disp { font-family:var(--disp); font-stretch:125%; font-weight:800; text-transform:uppercase; }

/* ---------- Barre ---------- */
.top { position:fixed; inset:0 0 auto; display:flex; justify-content:space-between; padding:20px 28px 34px; z-index:20; color:#fff; pointer-events:none; background:linear-gradient(var(--bg) 52%, transparent); }
.top > * { pointer-events:auto; }
.top nav { display:flex; gap:22px; }

/* ---------- Affiche ---------- */
.hero { min-height:100vh; min-height:100dvh; display:grid; place-items:center; position:relative; padding:96px 0 90px; overflow:hidden; --px:0; --py:0; }
.name { font-family:var(--disp); text-transform:uppercase; color:var(--acc); line-height:.8; letter-spacing:-.035em; font-size:clamp(54px,16.2vw,300px); text-align:center; position:relative; white-space:nowrap; }
.name .w { display:block; }
.name .l { display:inline-block; font-variation-settings:"wdth" var(--w), "wght" var(--wg); transition:--w .35s var(--e), --wg .35s var(--e); }
.photo { position:absolute; left:50%; top:50%; width:clamp(120px,19vw,300px); aspect-ratio:1; border-radius:50%; overflow:hidden; z-index:3; box-shadow:0 0 0 6px var(--bg);
  transform:translate(calc(-50% + var(--px) * 22px), calc(-52% + var(--py) * 22px)); transition:transform .5s var(--e); }
/* Bichromie : la photo passe en niveaux de gris, puis la couleur du lettrage est
   multipliée dessus — le noir reste noir, le blanc devient exactement la couleur
   de l'accent. Changer l'accent change donc la photo avec lui. */
.photo img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1) contrast(1.2) brightness(1.12); }
.photo::after { content:""; position:absolute; inset:0; background:var(--acc); mix-blend-mode:multiply; opacity:1; }
[data-photo="nb"] .photo::after { display:none; }
[data-photo="couleur"] .photo::after { display:none; }
[data-photo="couleur"] .photo img { filter:none; }
[data-photo="off"] .photo { display:none; }
.tag { position:absolute; bottom:44px; left:0; right:0; text-align:center; color:var(--dim); z-index:4; padding:0 20px; }
.tag b { color:var(--fg); font-weight:500; }
.arrow { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); font-size:18px; color:var(--dim); animation:bob 2.2s ease-in-out infinite; }
@keyframes bob { 50% { transform:translate(-50%,6px); } }

/* Téléphone : pas de pointeur, donc les lettres respirent d'elles-mêmes — peu,
   pour que le nom ne change pas de largeur d'un tiers. */
@keyframes breathe { 0%,100% { --w:var(--w0); --wg:800; } 50% { --w:calc(var(--w0) + 14); --wg:680; } }
@media (hover:none), (max-width:760px) {
  .name { --w0:76; font-size:min(23vw, 150px); }
  .name .l { --w:var(--w0); animation:breathe 6s ease-in-out infinite; animation-delay:calc(var(--i) * .16s); }
  .photo { top:auto; bottom:128px; width:min(34vw,150px); transform:translate(-50%,0); }
  .hero { padding-bottom:130px; }
}

/* ---------- Bandeau ---------- */
.ticker { background:var(--bg); color:var(--acc); overflow:hidden; white-space:nowrap; padding:14px 0; border-block:1px solid var(--line); }
.ticker div { display:inline-block; animation:tick 40s linear infinite; font:800 clamp(18px,2.4vw,30px)/1 var(--disp); font-stretch:125%; text-transform:uppercase; letter-spacing:-.01em; }
.ticker span { margin:0 44px; }
@keyframes tick { to { transform:translateX(-50%); } }

/* ---------- Sections ---------- */
main { padding:0 28px; max-width:1500px; margin:0 auto; }
.sec { padding:140px 0 0; }
.sh { display:flex; gap:14px; color:var(--dim); margin-bottom:6px; }
.sec > h2 { font:800 clamp(30px,8vw,128px)/.9 var(--disp); font-stretch:125%; text-transform:uppercase; letter-spacing:-.04em; margin-bottom:46px;
  color:transparent; -webkit-text-stroke:1.5px var(--acc); }
[data-titles="plein"] .sec > h2 { color:var(--acc); -webkit-text-stroke:0; }
@supports (animation-timeline:view()) {
  [data-titles="contour"] .sec > h2 { background:linear-gradient(var(--acc),var(--acc)) no-repeat 0 0 / 0% 100%; -webkit-background-clip:text; background-clip:text; animation:fill linear both; animation-timeline:view(); animation-range:cover 33% cover 58%; }
  @keyframes fill { to { background-size:100% 100%; } }
}
/* Repli : les navigateurs sans `animation-timeline` reçoivent la même progression
   par script (--p, de 0 à 1). Même rendu, même plage. */
.no-timeline[data-titles="contour"] .sec > h2 { background:linear-gradient(var(--acc),var(--acc)) no-repeat 0 0 / calc(var(--p,0) * 100%) 100%; -webkit-background-clip:text; background-clip:text; }
/* Mouvement réduit : pas de remplissage progressif, le titre est plein. */
@media (prefers-reduced-motion:reduce) {
  .sec > h2 { color:var(--acc) !important; -webkit-text-stroke:0 !important; background:none !important; animation:none !important; }
}
details { border-top:1px solid var(--line); position:relative; }
details:last-of-type { border-bottom:1px solid var(--line); }
summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:minmax(96px,10%) 1fr auto 28px; gap:18px; align-items:baseline; padding:22px 0; transition:padding .35s var(--e), color .2s; position:relative; }
summary::-webkit-details-marker { display:none; }
summary::before { content:""; position:absolute; left:0; bottom:-1px; height:2px; width:0; background:var(--acc); transition:width .55s var(--e); }
summary:hover::before, details[open] > summary::before { width:100%; }
summary:focus-visible, .tweaks button:focus-visible, .contact a:focus-visible, .top a:focus-visible { outline:2px solid var(--acc); outline-offset:4px; }
summary .n { color:var(--dim); }
summary .t { font:800 clamp(26px,5.2vw,76px)/.98 var(--disp); font-stretch:125%; text-transform:uppercase; letter-spacing:-.03em; }
summary .t small { display:block; font:500 12px/1.5 "JetBrains Mono",monospace; letter-spacing:.14em; color:var(--dim); margin-top:10px; }
summary .s { color:var(--dim); text-align:right; max-width:30ch; font-size:14px; }
summary .pm { font:500 22px/1 "JetBrains Mono",monospace; color:var(--dim); text-align:right; transition:transform .35s var(--e), color .2s; }
summary:hover { color:var(--acc); padding-left:14px; }
summary:hover .pm, details[open] .pm { color:var(--acc); }
details[open] > summary { color:var(--acc); }
details[open] .pm { transform:rotate(45deg); }
.body { display:grid; grid-template-columns:minmax(96px,10%) 1fr; gap:18px; padding:6px 0 48px; animation:open .5s var(--e); }
@keyframes open { from { opacity:0; transform:translateY(-10px); } }
.body .in { max-width:84ch; display:grid; gap:12px; color:#d6d7d4; }
.body ul { list-style:none; display:grid; gap:10px; }
.body li { padding-left:22px; position:relative; }
.body li::before { content:"→"; position:absolute; left:0; color:var(--acc); }
.lab { color:var(--dim); margin-top:10px; }
/* La preuve est un fait du poste, pas un titre : une pastille discrète sur la ligne
   fermée, et un paragraphe sobre dans la fiche, avec sa base de comparaison. */
.pchip { font:500 12px/1.4 "JetBrains Mono",monospace; letter-spacing:.06em; color:var(--hot); white-space:nowrap; }
.pf { border-left:2px solid var(--hot); padding-left:14px; display:grid; gap:4px; }
.pf b { color:var(--hot); font-weight:700; }
.pf small { color:var(--dim); font-size:13.5px; }
.pf a { color:var(--acc); text-decoration:underline; text-underline-offset:3px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chips span { border:1px solid #333; border-radius:99px; padding:3px 12px; font:500 12px/1.6 "JetBrains Mono",monospace; letter-spacing:.06em; color:var(--dim); }
.big { font:800 clamp(30px,6vw,88px)/1.02 var(--disp); font-stretch:125%; letter-spacing:-.03em; text-transform:uppercase; padding:70px 0 10px; max-width:18ch; }
.big em { font-style:normal; color:var(--acc); }
.contact { margin:150px 0 0; padding:36px 0 110px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:20px; }
.contact a { font:800 clamp(38px,10vw,150px)/.9 var(--disp); font-stretch:125%; text-transform:uppercase; letter-spacing:-.04em; color:var(--acc); transition:letter-spacing .5s var(--e), color .2s; }
.contact a:hover { color:var(--fg); letter-spacing:-.02em; }

/* =========================================================================
   OUVERTURE — la page d'accueil se compose sous les yeux
   -------------------------------------------------------------------------
   Il n'y a pas de séquence séparée qui s'effacerait pour laisser la place au
   CV. L'ouverture joue SUR la vraie page d'accueil : les lettres du nom, la
   photo, la ligne de poste et la barre sont les éléments définitifs, qui
   partent d'un état de départ et arrivent à leur état de repos. La dernière
   image de l'animation est donc la page elle-même — pas une copie qui lui
   ressemble, pas un raccord à mesurer : il n'y a rien à raccorder.

   Trois règles font tenir cette garantie, et aucune ne se voit à l'écran
   quand elle manque, sauf par un saut d'une image :
   - chaque animation porte `backwards` et jamais `forwards` : l'état d'arrivée
     est celui que la feuille déclare déjà, et non une valeur recopiée dans une
     keyframe. Les `from` sont les seuls états déclarés ici ; le `to` est le
     style au repos, par construction ;
   - tout démarre après le chargement des polices : sinon le nom serait
     recomposé en pleine animation, quand Archivo remplace la police de repli ;
   - la barre de défilement a sa place réservée dès le début : sans elle, la
     page se décalerait de sa largeur quand le défilement est rendu. */
html { scrollbar-gutter:stable; }
html.intro-lock { overflow:hidden; }
html.intro-wait *, html.intro-wait *::before, html.intro-wait *::after { animation-play-state:paused !important; }

@keyframes rise    { from { opacity:0; transform:translateY(45%); } }
@keyframes inflate { from { --w:62; --wg:100; } }
@keyframes tint    { from { color:var(--fg); } }
@keyframes pop     { from { clip-path:circle(0% at 50% 50%); } 60% { clip-path:circle(54% at 50% 50%); } to { clip-path:circle(150% at 50% 50%); } }
@keyframes settle  { from { transform:scale(1.4); } }
@keyframes up      { from { opacity:0; transform:translateY(14px); } }
@keyframes fade    { from { opacity:0; } }

@media (prefers-reduced-motion:no-preference) {
  /* Chaque lettre apparaît fine et étroite, puis la chasse et la graisse
     s'ouvrent en vague, de gauche à droite, et la couleur passe du blanc à
     l'accent. Le décalage vient de l'indice de la lettre (--i). */
  .name .l {
    animation: rise .6s var(--e) backwards, inflate 1.1s var(--e) backwards, tint 1.1s var(--e) backwards;
    animation-delay: calc(.15s + var(--i) * .06s), calc(.8s + var(--i) * .06s), calc(.8s + var(--i) * .06s);
  }
  .photo { animation: pop .95s var(--e) 1.5s backwards; }
  .photo img { animation: settle 1.3s var(--e) 1.5s backwards; }
  .tag { animation: up .7s var(--e) 2.1s backwards; }
  .top { animation: fade .6s ease 2.3s backwards; }
  .arrow { animation: fade .6s ease 2.4s backwards, bob 2.2s ease-in-out 3s infinite; }
}
/* Téléphone : la respiration du nom ne commence qu'une fois l'ouverture finie. */
@media (prefers-reduced-motion:no-preference) and ((hover:none) or (max-width:760px)) {
  .name .l {
    animation: rise .6s var(--e) backwards, inflate 1.1s var(--e) backwards, tint 1.1s var(--e) backwards, breathe 6s ease-in-out infinite;
    animation-delay: calc(.15s + var(--i) * .06s), calc(.8s + var(--i) * .06s), calc(.8s + var(--i) * .06s), calc(3s + var(--i) * .16s);
  }
}
.skip { position:fixed; left:28px; bottom:20px; z-index:50; background:none; border:1px solid #333; color:var(--dim); border-radius:99px; padding:5px 14px; cursor:pointer; font:inherit; }
.skip:hover { color:var(--fg); border-color:var(--fg); }
.skip:focus-visible { outline:2px solid var(--acc); outline-offset:3px; }
html:not(.intro-lock) .skip { display:none; }

/* ---------- Réglages ---------- */
.tweaks { position:fixed; right:14px; bottom:14px; z-index:40; background:rgba(18,18,18,.86); backdrop-filter:blur(14px); border:1px solid #2c2c2c; border-radius:16px; padding:10px 12px; display:grid; gap:8px; font-size:10.5px; max-width:calc(100vw - 28px); }
.tweaks[data-closed="true"] .rows { display:none; }
.tweaks .hd { display:flex; justify-content:space-between; gap:18px; cursor:pointer; color:var(--dim); }
.tweaks .r { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tweaks .r > span { color:var(--dim); width:56px; }
.tweaks button { font:inherit; letter-spacing:inherit; text-transform:inherit; background:none; color:var(--fg); border:1px solid #333; border-radius:99px; padding:3px 10px; cursor:pointer; }
.tweaks button[aria-pressed="true"] { background:var(--fg); color:#000; border-color:var(--fg); }
.tweaks .sw { width:18px; height:18px; padding:0; border-radius:50%; border:2px solid #333; }
.tweaks .sw[aria-pressed="true"] { border-color:#fff; }

@media (max-width:760px) {
  .top nav { display:none; }
  summary { grid-template-columns:1fr 28px; }
  summary .n, summary .s { display:none; }
  .body { grid-template-columns:1fr; }
  .body > span { display:none; }
    .tweaks { right:10px; bottom:10px; }
}
@media (prefers-reduced-motion:reduce) {
  .ticker div, .arrow, .name .l { animation:none !important; }
  .body, summary::before, .photo { animation:none; transition:none; }
  html { scroll-behavior:auto; }
}
</style>
</head>

<div class="top mono"><span id="brand"></span><nav id="nav"></nav></div>

<header class="hero" id="hero">

ix (Renta Menu)."},{"title":"Google Apps Script","nature":"produit","text":"Développement des outils internes présentés en section Outils."},{"title":"Développement web & desktop","nature":"produit","text":"Hub d’outils magasin, interfaces d’aide à la vente, application de suivi commercial."},{"title":"Mise en production","nature":"cadre","text":"Environnements, contrôles qualité et déploiements automatisés sur KuT, PANUM et L’Ortabels."}],"quote":"J’apprends à partir des problèmes que je rencontre sur le terrain."},"experiences":[{"id":"krys","detailLabel":"Le système de pilotage","role":"Opticien collaborateur","company":"Krys","date":"2025 → aujourd’hui","recency":"now","context":"En plus de la vente, j’ai pris en charge une part croissante de l’organisation et de l’outillage du magasin.","bullets":["Mise en place d’un système de pilotage reliant suivi des devis et du tiers payant, prochaine action, charge par collaborateur et brief quotidien. Les outils s’alimentent entre eux : les dossiers à reprendre deviennent des priorités visibles, puis des actions attribuées à chacun. La direction voit où l’activité bloque et qui doit agir.","Contrôles automatisés des saisies dans le suivi des devis, et comparaison avec le logiciel métier pour repérer les dossiers non suivis et mesurer l’écart.","Méthode de back-office éprouvée chez Générale d’Optique, défendue auprès de la direction et de l’équipe en place jusqu’à son adoption : procédures de contrôle des commandes, de dispatch et de traitement des retards, vérifications à J+1, rendez-vous de livraison lissés sur la semaine.","Outillage des tâches courantes du magasin, regroupées en un point d’entrée unique pour supprimer les ressaisies et uniformiser les documents produits.","Conception et envoi d’une campagne e-mail sur une base de plus de mille clients segmentée, consentements vérifiés avant envoi, 96,5 % de délivrabilité. Attribution suivie jusqu’à la prise de rendez-vous en magasin."],"a4Summary":"Organisation back-office · outils métiers · suivi de l’activité · procédures · optimisation des flux","result":"Trois outils utilisés chaque jour par l’équipe : suivi des devis, brief quotidien et hub d’outils du magasin. Les deux premiers, conçus dans mon poste précédent, ont été repris ici parce qu’ils servaient, sans que personne ne les ait demandés."},{"id":"generale-optique","detailLabel":"La reprise du magasin","role":"Responsable de magasin","company":"Générale d’Optique","date":"2024 → 2025","recency":"recent","context":"Reprise d’un magasin en difficulté : relance commerciale, réorganisation du fonctionnement quotidien et constitution de l’équipe.","bullets":["Rédaction de l’offre d’emploi, conduite des entretiens et formation des deux collaborateurs recrutés.","Stratégie de présence locale proposée et mise en place : actions ciblées, référencement local et collecte d’avis Google.","Formalisation des procédures de contrôle, de dispatch et de traitement des retards. Refonte des horaires et des règles de présence pour aligner les effectifs sur la charge réelle.","Instauration d’un brief de début de journée et d’un suivi commun des devis : tâches de back-office attribuées nommément, dossiers à reprendre visibles de toute l’équipe.","Conception d’Opti’Profit, un outil d’aide à la décision qui croise besoin technique, budget du client, réseau de soins, prix de vente et coût d’achat pour ne proposer que des solutions compatibles et préserver la marge. Pendant la vente, le prix final, la remise et la marge s’affichent immédiatement, ce qui permet d’ajuster l’offre sur place."],"a4Summary":"Redynamisation commerciale · organisation du point de vente · recrutement et formation · conception d’outils","statsLabel":"Sur les deux mois qui ont suivi, ces actions ont contribué à","stats":[{"value":"+83 % CA"},{"value":"+5,6 pts","label":"de marge"}],"statsBase":"Écarts mesurés par rapport à la moyenne des seize mois précédents.","result":"Réorganisation et implication saluées par la direction régionale. Le brief quotidien et le suivi des devis conçus pour ce poste sont aujourd’hui utilisés par mon équipe, dans une autre enseigne."},{"id":"terrain","detailLabel":"Onze ans, trois organisations","role":"Opticien collaborateur","company":"GrandOptical · Krys · Lissac","date":"2012 → 2023","recency":"past","context":"Onze ans en magasin, dans trois enseignes.","bullets":["Vente conseil et traitement des dossiers complexes : contraintes techniques, réseaux de soins, tiers payant.","Trois façons différentes d’organiser un magasin, vécues de l’intérieur : c’est là que j’ai appris ce qui fonctionne vraiment en point de vente.","Bascule progressive vers les sujets d’organisation : méthodes de travail, fiabilisation des calculs récurrents et du suivi des dossiers."],"a4Summary":"Onze ans de terrain, trois enseignes, trois organisations : vente, dossiers complexes, puis organisation et fiabilisation des méthodes."}],"outils":[{"id":"optiprofit","title":"Opti’Profit","category":"Aide à la décision commerciale","nature":"produit","status":"Transmis à la demande du directeur régional GrandVision","detailLabel":"Pourquoi pas une formation","chips":["Arbitrage en vente","Réseaux de soins","Rentabilité","Temps réel","Google Apps Script"],"summary":"Outil utilisé pendant la vente pour trouver le meilleur compromis entre besoin technique, budget du client et marge du magasin.","context":"Le bon produit dépend du besoin technique, du budget, des contraintes du réseau de soins et de la marge. L’information est répartie entre les catalogues fournisseurs et les grilles tarifaires des mutuelles, et la décision se prend en quelques secondes, avec le client en face.","arbitrage":"Une formation ou une grille écrite ne suffisaient pas : les catalogues et les accords changent souvent, et ce qu’on apprend à l’avance est oublié ou dépassé au moment de vendre. J’ai donc choisi d’apporter l’information au moment de la vente, au lieu de demander au vendeur de la retenir.","action":"Rassemblement des catalogues fournisseurs et des grilles mutuelles en une source unique, filtrage des produits compatibles avec le besoin et le budget, et mise en évidence de l’écart de marge entre deux solutions équivalentes pour le client. Développé sous Google Apps Script.","results":"Les vendeurs n’ont plus eu à comparer les catalogues devant le client, et le choix du produit est devenu clair au moment de la vente. Utilisé pendant toute la durée de mon poste. Conçu sur mon temps personnel, l’outil m’appartient. Je l’ai transmis à la demande du directeur régional de GrandVision, qui l’envisageait pour le réseau de magasins franchisés de la Générale d’Optique."},{"id":"briefmaker","title":"Brief’Maker","category":"Organisation quotidienne du magasin","nature":"produit","status":"En usage quotidien depuis sa conception","detailLabel":"Nommer qui fait quoi","chips":["Coordination d’équipe","Attribution des tâches","Priorisation","Back-office","Agrégation","Agenda Google"],"summary":"Le brief du début de journée : planning, agenda et dossiers en cours sur une seule vue, et les tâches réparties nommément entre les collaborateurs.","context":"L’information se perdait d’une équipe à l’autre, et les tâches de back-office n’apparaissaient nulle part : chaque équipe pensait que l’autre s’en était occupée. Il en résultait des oublis, et une vision floue de l’activité pour la direction.","arbitrage":"Il fallait d’abord un moment dans la journée où chaque tâche est attribuée à quelqu’un. C’est cette décision qui résout le problème. Mais aucun responsable n’allait rassembler quatre sources d’information à la main chaque matin : c’est pour cela qu’un outil est devenu nécessaire.","action":"Une feuille de brief qui rassemble automatiquement les informations du jour (planning de l’équipe, rendez-vous de l’agenda, suivi des dossiers, devis et tiers payant), puis attribue les tâches à chaque collaborateur et permet de saisir les indicateurs et les informations managériales.","results":"Utilisé chaque jour dans le magasin où je travaille aujourd’hui. Personne ne l’avait demandé : l’équipe l’a adopté parce qu’il lui servait."},{"id":"hub-opticien","title":"Hub Outils Opticien","category":"Outillage du quotidien en magasin","nature":"produit","status":"En usage quotidien en magasin","detailLabel":"Supprimer la ressaisie","chips":["Tâches récurrentes","Fiabilisation des calculs","Standardisation","Données locales","Application web"],"liveProduct":false,"link":{"label":"Découvrir le hub","url":"https://j-rbs91.github.io/Hub_Tools_N_Templates/"},"summary":"Un point d’entrée unique pour les tâches courtes et répétées du magasin (demande au médecin, clôture de caisse, calcul d’épaisseur), paramétrées une fois et utilisables sans formation.","context":"Ces tâches s’appuyaient sur des documents dispersés, des calculs refaits à la main et les mêmes informations ressaisies chaque fois. Chacune paraît mineure, mais répétées chaque jour, elles prennent du temps et laissent passer des erreurs.","arbitrage":"Une procédure n’aurait rien changé : les collaborateurs travaillaient bien, c’est la tâche qui était mal outillée. Un mode opératoire aurait ajouté une lecture à une tâche de deux minutes, et personne ne l’aurait suivi. J’ai préféré ne rien demander de plus à l’équipe et supprimer la ressaisie, ce qui supprime aussi les écarts entre collaborateurs.","action":"Regroupement de ces usages en un point d’entrée unique : demandes et comptes rendus au médecin normalisés avec export PDF et envoi par mail, clôture de caisse reprenant le comptage de la veille et contrôlant l’écart avec le logiciel métier, calcul d’épaisseur et de décentrement avec représentation à l’échelle 1:1 du verre taillé et monté. Les coordonnées du magasin sont saisies une fois et alimentent tous les outils ; les données restent sur le poste, sans transmission serveur.","results":"En service dans le magasin : les documents sont identiques quel que soit le collaborateur qui les produit, et les calculs récurrents ne se refont plus à la main."},{"id":"suivi-devis","title":"Suivi des devis & tiers payant","category":"Suivi commercial en magasin","nature":"produit","status":"En usage quotidien par toute l’équipe","detailLabel":"Ce que l’équipe saisit","chips":["Suivi de dossiers","Tiers payant","Relances","Google Apps Script"],"summary":"Suivi partagé qui tient chaque devis de son édition à sa conclusion : statut du tiers payant, prochaine action datée, motif de perte et historique des échanges avec le client.","context":"Un devis se perd rarement d’un coup : il traîne. Il manque une pièce, l’accord de prise en charge n’aboutit pas, ou personne ne fait la relance. Sans suivi commun, chacun redécouvre le dossier à chaque fois, et le magasin ne sait ni ce qu’il perd, ni pourquoi.","arbitrage":"Avant de construire quoi que ce soit, il fallait décider à partir de quand un dossier devient à risque, qui en est responsable, et surtout ce que l’équipe accepterait de saisir. Un suivi plus détaillé aurait été plus précis, mais personne ne l’aurait rempli. J’ai choisi le niveau de détail que l’équipe peut tenir au quotidien.","action":"Matérialisation de ces règles en un suivi partagé : neuf statuts de tiers payant, plateforme et mutuelle, date de prochaine action, motif de blocage ou de perte, profil d’achat, collaborateur en charge, et historique daté des échanges avec le client.","results":"Rempli chaque jour par l’équipe, sans que personne ait eu à l’imposer. Ses colonnes ont servi de base à PANUM : statuts de financement, motifs, profils d’achat et historiques y sont repris tels quels."},{"id":"panum","title":"PANUM","category":"Suivi commercial & pilotage de la performance","nature":"produit","status":"Abouti · en attente de déploiement pilote","detailLabel":"Pourquoi quitter le tableur","chips":["Priorisation des relances","Causes de perte","Périmètres de visibilité","Aide à la décision"],"link":{"label":"Découvrir PANUM","url":"https://panum.fr/"},"summary":"Solution de suivi commercial et de pilotage de la performance : centraliser les dossiers, prioriser les relances et rendre visibles les causes de sous-performance.","context":"Le suivi des devis et du tiers payant repose souvent sur des pratiques hétérogènes. Résultat : des dossiers qui stagnent, des relances oubliées, et un management qui ne sait pas précisément pourquoi les ventes se perdent.","arbitrage":"Le suivi partagé fonctionnait pour l’équipe, mais pas pour piloter un réseau. Un tableur ne permet pas de donner à chacun une vue adaptée à son niveau hiérarchique, ni de garder l’historique d’un blocage pour en comprendre la cause. Il fallait donc un vrai logiciel, construit autour des responsabilités de chaque niveau.","action":"Modélisation de la hiérarchie d’un réseau direction, management, collaborateurs avec les périmètres de visibilité correspondants, historisation des épisodes de blocage pour en mesurer les causes, et traitement des données personnelles intégré dès la conception.","results":"Le produit est terminé et testé. Le déploiement pilote en magasin servira à valider la priorisation sur des données réelles ; il attend la création de la structure juridique qui permettra de signer avec les points de vente."},{"id":"planning","title":"Gestionnaire de Planning","category":"Planification des effectifs","nature":"produit","status":"Resté en service après mon départ","detailLabel":"Revoir les horaires","chips":["Charge et effectifs","Contraintes d’ouverture","Planification","Ressources","Flux client"],"summary":"Outil de construction de planning alignant les effectifs présents sur la charge réelle et les contraintes d’ouverture du point de vente.","context":"On attribuait les tensions d’organisation aux personnes. Elles venaient en fait d’un décalage entre les effectifs présents, la charge de travail et les contraintes d’ouverture du magasin.","arbitrage":"La vraie décision était de revoir les règles : horaires d’ouverture, plages de présence et répartition des créneaux. L’outil ne décide rien à la place du responsable : il permet d’appliquer ces règles chaque semaine, au lieu de tout refaire de tête et de renégocier chaque planning.","action":"Développement d’un outil de construction de planning ajustant les effectifs à l’activité attendue à partir des contraintes d’exploitation du point de vente.","results":"Les conflits d’organisation récurrents ont cessé pendant la durée de mon poste, et le coût du personnel s’est aligné sur le flux réel. Après mon départ, un collaborateur l’a repris pour construire ses plannings. Une version simplifiée, qui affiche le planning type selon la date, est intégrée à Brief’Maker pour montrer le planning du jour."}],"projets":[{"id":"kut","short":"KuT","title":"KuT : logiciel de gestion pour salons et activités de bien-être","subtitle":"Conception produit & pilotage · en ligne, développement continu","bullets":["Traduction des besoins d’un salon à prestations récurrentes en parcours, règles métier et fonctionnalités : clients, réservations, planning, fidélité, campagnes commerciales et indicateurs. Module de caisse et exports comptables en cours.","Écriture des règles métier, des cas limites et des plans de tests, pour vérifier de façon fiable le comportement des fonctions sensibles.","Pilotage du projet : cadrage fonctionnel, priorisation des évolutions, validation des usages et préparation du déploiement."],"link":{"label":"Découvrir KuT","url":"https://kut.panum.fr/"},"transferableSkills":[{"title":"Conception produit","nature":"produit","text":"Partir d’un besoin métier réel et le traduire en parcours, règles fonctionnelles et priorités claires."},{"title":"Sécurisation fonctionnelle","nature":"cadre","text":"Écrire les règles et les cas limites avant le code, pour pouvoir vérifier ensuite que tout fonctionne comme prévu."}]},{"id":"ortabels","short":"L’Ortabels","title":"L’Ortabels : projet maraîcher et outil d’aide à la décision","subtitle":"Modélisation agronomique · en ligne, développement continu","bullets":["Le développement d’une culture dépend de la chaleur accumulée (les degrés-jours), et non du nombre de semaines écoulées. Le calendrier seul ne suffit donc pas pour planifier.","Conception d’un outil exploitant les températures locales, les degrés-jours et les modèles de croissance thermique pour estimer les fenêtres de semis, les stades de développement et les périodes de récolte.","Structuration du projet maraîcher lui-même : planification des cultures, organisation des rotations et suivi des séries."],"link":{"label":"Découvrir L’Ortabels","url":"https://app.ortabels.fr/"},"transferableSkills":[{"title":"Modèles prédictifs","nature":"produit","text":"Transformer des données brutes en dates concrètes pour décider quand semer et quand récolter."},{"title":"Organisation","nature":"cadre","text":"La même logique qu’un back-office bien organisé : planifier les étapes et rendre visible ce qui doit être fait."}]},{"id":"renta-menu","short":"Renta Menu","title":"Renta Menu : pilotage de la rentabilité en restauration","subtitle":"Outil décisionnel · Rentabilité en restauration","bullets":["Modélisation du coût matière par composante de menu et calcul automatisé des marges brutes.","Détermination des prix de vente par régression (linéaire inverse et logarithmique), à partir du coût et de l’élasticité observée.","Calcul du besoin en effectifs et du coût employeur réel selon le volume de couverts prévisionnel.","Seuil de rentabilité, marge nette par couvert et projections de résultat calculés en continu."],"transferableSkills":[{"title":"Analyse de données","nature":"produit","text":"Rassembler des données de sources différentes pour en tirer des indicateurs utilisables tout de suite."},{"title":"Rentabilité","nature":"produit","text":"Trouver comment protéger la marge sans changer le positionnement de l’établissement."}]}],"competences":[{"id":"pilotage-commercial","title":"Pilotage commercial & rentabilité","summary":"Développer le flux clients en tenant la marge sur chaque vente.","nature":"produit","detailLabel":"Relancer sans remise","tags":["Flux clients","Marge","Référencement local"],"enjeu":"Relancer un magasin en difficulté sans acheter le chiffre par la remise.","miseEnPlace":"J’ai travaillé deux leviers en parallèle. Pour faire venir des clients : actions locales ciblées, référencement local et collecte d’avis Google. Pour préserver la marge de chaque vente : un outil d’aide au choix du produit, utilisé pendant la vente.","exemple":"L’outil fait ressortir le mix produit le plus pertinent selon le budget du client, les contraintes techniques, les offres en cours et les réseaux de soins.","resultat":"Chez Générale d’Optique, ces actions ont contribué à +83 % de chiffre d’affaires et +5,6 points de marge sur les deux mois qui ont suivi, mesurés par rapport à la moyenne des seize mois précédents.","a4Rank":3,"a4Statement":"Développer l’activité tout en maintenant la qualité économique des ventes.","a4Proofs":["Actions commerciales locales","Trafic et marge travaillés ensemble","Arbitrage produit en situation de vente"]},{"id":"organisation-process","title":"Organisation & formalisation des process","summary":"Transformer des pratiques implicites en procédures écrites et réellement utilisées.","nature":"cadre","detailLabel":"Répartir la charge","tags":["Procédures","Back-office","Nivellement de charge","Priorisation"],"enjeu":"Éviter les oublis et les « qui s’en occupe ? » du quotidien.","miseEnPlace":"Procédure de contrôle et de dispatch back-office, priorisation des dossiers complets et incomplets, organisation J+1 des montages et vérifications, cadrage des rendez-vous de livraison. Je priorise selon une logique inspirée du modèle de Kano : sécuriser d’abord ce qui crée de l’insatisfaction quand c’est absent, renforcer ensuite ce qui améliore l’expérience.","exemple":"Un même principe appliqué deux fois : \u003cstrong>répartir la charge au lieu de subir le pic\u003c/strong>. Les rendez-vous de livraison étalés sur la semaine ont supprimé la surcharge du samedi, et les plannings construits sur l’activité prévue ont ajusté les effectifs au flux de clients.","a4Rank":1,"a4Statement":"Transformer les pratiques implicites en méthodes claires et utilisables.","a4Proofs":["Procédures de contrôle, dispatch, retards","Vérifications en J+1","Livraisons lissées sur la semaine","Plannings construits sur l’activité attendue"]},{"id":"outils-metiers","title":"Conception d’outils métiers","summary":"Concevoir et développer moi-même les outils qui manquent à l’activité.","nature":"produit","detailLabel":"Partir de l’usage","tags":["Problème observé","Adoption sans formation","Google Apps Script","Web","Automatisation"],"enjeu":"Donner au terrain des repères concrets quand la bonne décision dépend de plusieurs contraintes à la fois.","miseEnPlace":"Je conçois et je développe moi-même, sous Google Sheets et Apps Script comme en web : arbitrage produit en vente, calcul de dégression de verres techniques, suivi des devis et du tiers payant, brief quotidien, planification des effectifs, hub d’outils du magasin.","exemple":"Je conçois chaque outil à partir de ce que je vois l’équipe faire au quotidien, et je le veux utilisable sans formation : sinon, il n’est pas utilisé.","a4Rank":2,"a4Statement":"Concevoir des outils qui sécurisent une décision et suppriment les ressaisies.","a4Proofs":["Opti’Profit : arbitrage produit et marge","Brief’Maker : planning, dossiers, tâches","Suivi devis & tiers payant : statut et relance","Hub magasin : calculs et documents standardisés"]},{"id":"pilotage-donnee","title":"Pilotage par la donnée","summary":"Concevoir des indicateurs qui expliquent la performance et montrent où agir.","nature":"produit","detailLabel":"Constater ou agir","tags":["Indicateurs avancés","Contrôles automatisés","Reporting"],"enjeu":"Montrer où agir avant que le résultat soit joué.","miseEnPlace":"Je sépare les \u003cstrong>indicateurs retardés\u003c/strong>, qui constatent un résultat déjà joué, des \u003cstrong>indicateurs avancés\u003c/strong>, sur lesquels on peut encore agir : délais de traitement, discipline de relance, dossiers à risque, pertes évitables et santé du portefeuille. J’ai également mis en place des contrôles automatisés rapprochant le logiciel métier et les suivis internes.","exemple":"C’est la logique de PANUM : comprendre pourquoi une vente se perd, et quoi faire en priorité.","resultat":"Ces contrôles ont fait apparaître des dossiers absents des suivis internes, qui échappaient jusque-là au pilotage. Ils vérifient aussi mon propre outil : un dossier oublié dans le suivi des devis est repéré.","a4Rank":4,"a4Statement":"Construire des indicateurs qui montrent où agir.","a4Proofs":["Indicateurs avancés séparés des retardés","Délais, relances, dossiers à risque","Rapprochement automatisé de deux sources","PANUM : causes de sous-performance"]},{"id":"coordination-changement","title":"Coordination & conduite du changement","summary":"Traduire des objectifs en méthodes de travail que l’équipe accepte.","nature":"cadre","detailLabel":"Faire adopter","tags":["Direction","Terrain","Adhésion"],"enjeu":"Faire adopter des méthodes dans des environnements où tout ce qui ajoute de la complexité est rejeté d’office.","miseEnPlace":"Je présente chaque nouvelle méthode par ce qu’elle retire du travail de l’équipe : moins d’oublis, moins de ressaisie, une charge mieux répartie. C’est ce gain immédiat qui la fait adopter.","exemple":"Suivis quotidiens et procédures de back-office adoptés par les équipes, dans deux enseignes différentes.","resultat":"Chez Générale d’Optique, la réorganisation et mon implication ont été saluées par la direction régionale.","a4Rank":5,"a4Statement":"Relier les objectifs de la direction aux contraintes concrètes des équipes.","a4Proofs":["Tâches et responsabilités nominatives","Brief quotidien commun à l’équipe","Deux collaborateurs recrutés et formés","Méthodes adoptées dans deux enseignes"]}]};

<script>
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n + 1).padStart(2, "0");
const C = window.CV;
const [first, ...rest] = C.contact.name.split(" ");

/* ---- le nom : chaque lettre est un élément, pour que la police puisse bouger ---- */
let li = 0;
const word = (w) => `<span class="w" aria-hidden="true">${[...w].map((c) => `<span class="l" style="--i:${li++}">${c}</span>`).join("")}</span>`;
$("#name").setAttribute("aria-label", C.contact.name);
$("#name").innerHTML = word(first) + word(rest.join(" "));
$("#brand").textContent = C.contact.name;
$("#photo").src = window.PHOTO;
$("#tag").innerHTML = `<b>${C.contact.role}</b><br>${C.contact.secondaryRole.split(" · ")[0]}`;
const items = C.contact.secondaryRole.split(" · ");
$("#ticker").innerHTML = [...items, ...items, ...items, ...items].map((t) => `<span>${t}</span>`).join("");
const nav = [["Expériences", "experiences"], ["Outils", "outils"], ["Projets", "projets"], ["Compétences", "competences"], ["Formation", "formation"]];
$("#nav").innerHTML = nav.map(([l, id]) => `<a href="#${id}">${l}</a>`).join("");

/* ---- le document ---- */
const row = (n, title, sub, side, body, id) => `<details${id ? ` id="${id}"` : ""}><summary><span class="n mono">${n}</span><span class="t">${title}${sub ? `<small>${sub}</small>` : ""}</span><span class="s">${side || ""}</span><span class="pm">+</span></summary><div class="body"><span></span><div class="in">${body}</div></div></details>`;
const lab = (t) => `<div class="lab mono">${t}</div>`;
const sec = (id, n, title, count, inner) => `<section class="sec" id="${id}"><div class="sh mono"><span>${n}</span><span>${count}</span></div><h2>${title}</h2>${inner}</section>`;

const statsText = (e) => e.stats.map((x) => x.value + (x.label ? " " + x.label : ""));
const expId = (e) => "exp-" + e.id;
const exp = C.experiences.map((e) => {
  const stats = e.stats ? `<p class="pf"><span>${statsText(e).map((t) => `<b>${t}</b>`).join(" · ")}</span><small>${e.statsLabel} — ${e.statsBase}</small></p>` : "";
  const chip = e.stats ? `<span class="pchip">${statsText(e).join(" · ")}</span>` : "";
  return row(e.date, e.company, e.role, chip, `${e.context ? `<p>${e.context}</p>` : ""}<ul>${e.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>${stats}${e.result ? `<p>${e.result}</p>` : ""}`, expId(e));
}).join("");

/* Opti'Profit a été conçu et utilisé pendant le poste de Générale d'Optique. Le
   chiffre du poste est rappelé comme CONTEXTE : les données disent que relance,
   équipe et réorganisation ont joué ensemble, donc il n'est pas présenté comme
   le résultat de l'outil. */
const opti = C.experiences.find((e) => e.stats);
const ctxOpti = (o) => o.id === "optiprofit" && opti ? `${lab("Contexte mesuré")}<div class="pf"><span>Poste où il a servi : <a href="#${expId(opti)}" data-open="${expId(opti)}">${opti.company}, ${opti.date} ↗</a></span><span>${opti.statsLabel} ${statsText(opti).map((t) => `<b>${t}</b>`).join(" · ")}.</span><small>${opti.statsBase} Plusieurs actions ont joué ensemble : l’outil n’explique pas l’écart à lui seul.</small></div>` : "";
const out = C.outils.map((o, i) => row(pad(i), o.title, o.category, o.status,
  `<p>${o.summary}</p>${lab("Situation")}<p>${o.context}</p>${o.arbitrage ? lab("Décision") + `<p>${o.arbitrage}</p>` : ""}${lab("Réponse")}<p>${o.action}</p>${lab("Résultat")}<p>${o.results}</p>${ctxOpti(o)}<div class="chips">${o.chips.map((c) => `<span>${c}</span>`).join("")}</div>${o.link ? `<p><a style="color:var(--acc)" href="${o.link.url}">${o.link.label} ↗</a></p>` : ""}`)).join("");

const prj = C.projets.map((p, i) => row(pad(i), p.short, p.subtitle, "",
  `<ul>${p.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>${lab("Compétences transférables")}<ul>${p.transferableSkills.map((t) => `<li><b>${t.title}</b> — ${t.text}</li>`).join("")}</ul>${p.link ? `<p><a style="color:var(--acc)" href="${p.link.url}">${p.link.label} ↗</a></p>` : ""}`)).join("");

const comp = C.competences.map((c, i) => row(pad(i), c.title, "", c.summary,
  `${lab("Enjeu traité")}<p>${c.enjeu}</p>${lab("Ce que j’ai mis en place")}<p>${c.miseEnPlace}</p>${lab("Exemple concret")}<p>${c.exemple}</p>${lab("Résultat observable")}<p>${c.resultat}</p><div class="chips">${c.tags.map((t) => `<span>${t}</span>`).join("")}</div>`)).join("");

const f = C.formation;
const form = row(f.year, f.title, f.subtitle, "", "<p>" + f.continuousSkills.map((s) => `<b>${s.title}</b> — ${s.text}`).join("</p><p>") + "</p>") + `<p class="big">${f.quote.replace("problèmes", "<em>problèmes</em>")}</p>`;

$("#doc").innerHTML =
  `<p class="big">${C.profile.quote.replace("plus lisible", "<em>plus lisible</em>")}</p>` +
  sec("experiences", "01", "Expériences", `${C.experiences.length} postes`, exp) + sec("outils", "02", "Outils", `${C.outils.length} outils`, out) + sec("projets", "03", "Projets", `${C.projets.length} projets`, prj) + sec("competences", "04", "Compétences", `${C.competences.length} domaines`, comp) + sec("formation", "05", "Formation", f.year, form) +
  `<div class="contact"><a href="${C.contact.site.url}">Me contacter ↗</a><span class="mono" style="color:var(--dim)">${C.contact.name}<br>${C.contact.items[0].text}</span></div>`;

/* ---- « Voir le poste » : ouvre la fiche visée avant d'y aller ---- */
document.querySelectorAll("a[data-open]").forEach((a) => a.addEventListener("click", (ev) => {
  ev.preventDefault(); const d = document.getElementById(a.dataset.open); if (!d) return;
  d.open = true; d.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
}));

/* ---- les lettres suivent le pointeur ----
   Distance au curseur → axe de chasse et graisse. Les centres sont mesurés une
   fois au repos (et au redimensionnement) : mesurés pendant l'animation, ils
   bougeraient avec elle et la lettre courrait après son propre centre. */
const letters = [...document.querySelectorAll(".name .l")];
const hero = $("#hero");
let centers = [], raf = 0, mx = -1e5, my = -1e5;
const canMove = matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches;
function measure() { centers = letters.map((l) => { const r = l.getBoundingClientRect(); return [r.left + r.width / 2 + scrollX, r.top + r.height / 2 + scrollY]; }); }
function tick() {
  raf = 0; const R = innerWidth * 0.2;
  letters.forEach((l, i) => {
    const [cx, cy] = centers[i], t = Math.max(0, 1 - Math.hypot(mx + scrollX - cx, my + scrollY - cy) / R);
    l.style.setProperty("--w", (125 - 52 * t).toFixed(0)); l.style.setProperty("--wg", (800 - 340 * t).toFixed(0));
  });
}
if (canMove) {
  document.fonts.ready.then(measure); addEventListener("resize", measure);
  hero.addEventListener("pointermove", (e) => { if (e.pointerType !== "mouse" || document.documentElement.classList.contains("intro-lock")) return; mx = e.clientX; my = e.clientY; hero.style.setProperty("--px", ((e.clientX / innerWidth) - .5) * 2); hero.style.setProperty("--py", ((e.clientY / innerHeight) - .5) * 2); if (!raf) raf = requestAnimationFrame(tick); });
  hero.addEventListener("pointerleave", () => { mx = my = -1e5; hero.style.setProperty("--px", 0); hero.style.setProperty("--py", 0); if (!raf) raf = requestAnimationFrame(tick); });
}

/* ---- remplissage des titres : repli sans animation-timeline ---- */
if (!CSS.supports("animation-timeline: view()")) {
  document.documentElement.classList.add("no-timeline");
  const hs = [...document.querySelectorAll(".sec > h2")];
  const upd = () => hs.forEach((h) => { const r = h.getBoundingClientRect(), vh = innerHeight; const p = Math.min(1, Math.max(0, (vh * 0.62 - r.top) / (vh * 0.28))); h.style.setProperty("--p", p.toFixed(3)); });
  addEventListener("scroll", () => requestAnimationFrame(upd), { passive: true }); addEventListener("resize", upd); upd();
}

/* ---- l'ouverture : démarrage après les polices, fin lue sur les animations ----
   La durée n'est écrite nulle part : on attend que les animations FINIES de la
   page aient toutes fini. Allonger une keyframe n'oblige donc pas à retoucher
   le script, et le verrou de défilement ne peut pas se lever avant la fin. */
const root = document.documentElement;
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
const finite = () => document.getAnimations().filter((a) => a.effect && isFinite(a.effect.getComputedTiming().endTime));
function endIntro() { if (!root.classList.contains("intro-lock")) return; root.classList.remove("intro-lock"); root.classList.add("intro-done"); window.__introEnd = performance.now(); if (canMove) measure(); }
if (reduced) { root.classList.remove("intro-wait"); }
else {
  root.classList.add("intro-lock");
  const go = () => { if (!root.classList.contains("intro-wait")) return; root.classList.remove("intro-wait"); window.__introStart = performance.now(); Promise.all(finite().map((a) => a.finished.catch(() => {}))).then(endIntro); };
  Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]).then(go);
  const skip = () => { go(); finite().forEach((a) => a.finish()); endIntro(); };
  $("#skip").addEventListener("click", skip);
  addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") skip(); });
}

/* ---- réglages ---- */
const ACC = { fluo: "#c9ff2f", cuivre: "#ff9d63", glace: "#cfe3ff", blanc: "#f2f2ee" };
let T = { acc: "fluo", photo: "duo", titles: "contour" };
try { Object.assign(T, JSON.parse(localStorage.getItem("b-reglages-3") || "{}")); } catch (e) {}
const q = new URLSearchParams(location.search); for (const k of ["acc", "photo", "titles"]) if (q.get(k)) T[k] = q.get(k);
function apply() {
  document.documentElement.style.setProperty("--acc", ACC[T.acc] || ACC.fluo);
  document.body.dataset.photo = T.photo; document.body.dataset.titles = T.titles;
  document.querySelectorAll(".tweaks button").forEach((b) => b.setAttribute("aria-pressed", String(T[b.dataset.k] === b.dataset.v)));
  try { localStorage.setItem("b-reglages-3", JSON.stringify(T)); } catch (e) {}
}
document.querySelectorAll(".tweaks button").forEach((b) => b.addEventListener("click", () => { T[b.dataset.k] = b.dataset.v; apply(); }));
if (innerWidth < 760) { $("#tweaks").dataset.closed = "true"; $("#tw-x").textContent = "+"; }
$("#tw-hd").addEventListener("click", () => { const t = $("#tweaks"); const c = t.dataset.closed === "true"; t.dataset.closed = String(!c); $("#tw-x").textContent = c ? "−" : "+"; });
apply();
</script>
</body>
</html>
