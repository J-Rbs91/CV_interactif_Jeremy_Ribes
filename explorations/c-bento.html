<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exploration C — Bento en verre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* EXPLORATION C — « Bento en verre »
   Références : « Glassmorphism Portfolio » de Moumen Soliman (carte profil à
   liens animés, sections en verre), « Ruixen Card » (carte de profil), « Impact
   Experience » (une ligne par employeur, détails à droite) et « Skills
   Showcase » (liste qu'on survole pour l'explorer).
   La page n'a plus de colonne latérale : une barre en haut, puis une grille de
   blocs. Clair, un seul fond, des lueurs sous le pointeur.
   Aucun niveau de compétence n'est affiché : les données n'en portent pas, et
   une barre à 90 % serait un chiffre inventé. */
:root { --bg:#eceae4; --ink:#0b1f33; --ink2:#40566a; --mut:#4a5d70; --line:rgba(11,31,51,.12); --hot:#b9531c; --glass:linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,.48)); --edge:rgba(255,255,255,.85); --disp:"Archivo","Manrope",sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { color:var(--ink); font:400 15px/1.6 "Manrope", sans-serif; background:
  radial-gradient(60% 50% at 12% 0%, rgba(255,255,255,.9), transparent 70%),
  radial-gradient(50% 45% at 100% 20%, rgba(190,200,215,.55), transparent 70%),
  linear-gradient(170deg, #f1efea, #e6e3dc 60%, #dedbd3); background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
.mono { font:500 11px/1.4 "JetBrains Mono", monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); }

/* ---------- Barre ---------- */
.bar { position:sticky; top:14px; z-index:30; max-width:1240px; margin:14px auto 0; padding:10px 14px 10px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--glass); border:1px solid var(--edge); border-radius:999px; backdrop-filter:blur(18px) saturate(1.2); box-shadow:0 10px 30px rgba(11,31,51,.08); }
.bar b { font:800 14px/1 var(--disp); font-stretch:125%; letter-spacing:-.01em; }
.bar nav { display:flex; gap:4px; }
.bar nav a { padding:7px 13px; border-radius:99px; font-weight:600; font-size:13px; color:var(--ink2); transition:background .2s, color .2s; }
.bar nav a:hover { background:rgba(11,31,51,.07); color:var(--ink); }
.btn { background:var(--ink); color:#fff; padding:9px 18px; border-radius:99px; font-weight:700; font-size:13px; }
.btn:hover { background:#1d3d5c; }

/* ---------- Grille ---------- */
main { max-width:1240px; margin:26px auto 0; padding:0 14px 90px; display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
.card { position:relative; isolation:isolate; padding:28px; background:var(--glass); border:1px solid var(--edge); border-radius:26px; backdrop-filter:blur(16px) saturate(1.15); box-shadow:inset 0 1px 0 #fff, 0 16px 40px rgba(11,31,51,.08); overflow:hidden; }
.card::before { content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity .35s; background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.95), rgba(255,255,255,0) 70%); }
.card:hover::before { opacity:1; }
.c8{grid-column:span 8} .c7{grid-column:span 7} .c6{grid-column:span 6} .c5{grid-column:span 5} .c4{grid-column:span 4} .c12{grid-column:span 12}
h2 { font:800 13px/1 var(--disp); font-stretch:125%; letter-spacing:.02em; margin-bottom:20px; display:flex; justify-content:space-between; align-items:baseline; }
h2 small { font:500 11px/1 "JetBrains Mono", monospace; letter-spacing:.12em; color:var(--mut); text-transform:uppercase; }

/* Héros : la citation + la carte profil */
.hero h1 { font:800 clamp(34px, 4.6vw, 62px)/1.04 var(--disp); font-stretch:125%; letter-spacing:-.035em; max-width:16ch; margin:14px 0 22px; }
.hero .lead { max-width:58ch; color:var(--ink2); font-size:16px; }
.hero .lead strong { color:var(--ink); }
.facts { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:28px; }
.fact { background:rgba(255,255,255,.5); border:1px solid var(--edge); border-radius:18px; padding:16px; }
.fact b { display:block; font:800 14px/1.2 var(--disp); font-stretch:125%; margin-bottom:6px; }
.fact p { font-size:13px; color:var(--ink2); line-height:1.5; }

.me { text-align:center; display:flex; flex-direction:column; align-items:center; }
.me img { width:112px; height:112px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 3px #fff, 0 0 0 5px rgba(11,31,51,.12), 0 14px 30px rgba(11,31,51,.2); }
.me h3 { font:800 21px/1.1 var(--disp); font-stretch:125%; letter-spacing:-.02em; margin:18px 0 4px; }
.me .sub { font-size:13px; color:var(--ink2); max-width:28ch; margin-top:10px; }
.links { width:100%; display:grid; gap:8px; margin-top:22px; text-align:left; }
.links a { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,.55); border:1px solid var(--edge); border-radius:16px; padding:11px 15px; transition:transform .25s cubic-bezier(.62,0,.24,1), background .2s; }
.links a:hover { transform:translateX(5px); background:#fff; }
.links b { display:block; font-weight:700; font-size:14px; }
.links span { font-size:12px; color:var(--mut); }

/* Listes */
.list details { border-top:1px solid var(--line); }
.list details:first-of-type { border-top:0; }
.list summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:3px 14px; padding:15px 0; align-items:baseline; }
.list summary::-webkit-details-marker { display:none; }
.list summary .t { font:800 clamp(20px, 2.1vw, 28px)/1.1 var(--disp); font-stretch:125%; letter-spacing:-.025em; transition:transform .25s cubic-bezier(.62,0,.24,1); }
.list summary:hover .t { transform:translateX(6px); }
.list summary .d { text-align:right; }
.list summary .r { grid-column:1/-1; font-size:13px; color:var(--ink2); }
.list .body { padding:2px 0 22px; display:grid; gap:12px; color:var(--ink2); max-width:70ch; }
.list .body ul { list-style:none; display:grid; gap:9px; }
.list .body li { padding-left:18px; position:relative; }
.list .body li::before { content:"›"; position:absolute; left:2px; font-weight:800; color:var(--ink); }
.lab { margin-top:6px; }
.proof { display:flex; gap:30px; font:800 34px/1 var(--disp); font-stretch:125%; color:var(--hot); letter-spacing:-.03em; }
.proof small { display:block; font:500 11px/1.4 "JetBrains Mono", monospace; letter-spacing:.12em; color:var(--mut); margin-top:5px; text-transform:uppercase; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips span { background:rgba(11,31,51,.06); border-radius:99px; padding:3px 11px; font-size:12px; font-weight:600; color:var(--ink2); }

/* Outils : grille */
.tools { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.tool { position:relative; background:rgba(255,255,255,.55); border:1px solid var(--edge); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:8px; transition:transform .3s cubic-bezier(.62,0,.24,1), background .2s, box-shadow .3s; }
.tool:hover { transform:translateY(-4px); background:#fff; box-shadow:0 18px 36px rgba(11,31,51,.12); }
.tool .n { font:800 30px/1 var(--disp); font-stretch:125%; color:rgba(11,31,51,.18); }
.tool h3 { font:800 18px/1.15 var(--disp); font-stretch:125%; letter-spacing:-.02em; }
.tool p { font-size:13.5px; color:var(--ink2); }
.tool .st { margin-top:auto; padding-top:10px; border-top:1px solid var(--line); font-size:12.5px; font-weight:600; }
.tool details summary { cursor:pointer; list-style:none; color:var(--ink); font-weight:700; font-size:12.5px; margin-top:4px; }
.tool details summary::-webkit-details-marker { display:none; }
.tool details[open] summary { margin-bottom:8px; }
.tool .more { display:grid; gap:8px; font-size:13px; color:var(--ink2); }

.skills a { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); font-weight:700; }
.skills a:first-child { border-top:0; }
.skills small { display:block; font-weight:500; font-size:12.5px; color:var(--ink2); }
.skills a:hover b { transform:translateX(5px); }
.skills b { transition:transform .25s; display:inline-block; }

footer { max-width:1240px; margin:0 auto; padding:0 14px 50px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

@media (max-width: 960px) {
  .c8,.c7,.c6,.c5,.c4 { grid-column:span 12; }
  .tools { grid-template-columns:1fr 1fr; }
  .facts { grid-template-columns:1fr; }
}
@media (max-width: 620px) {
  .bar nav { display:none; }
  .tools { grid-template-columns:1fr; }
  .card { padding:22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } html { scroll-behavior:auto; } }
</style>
</head>

<script>window.CV = {"contact":{"name":"Jérémy Ribes","role":"Structuration de l’activité & outils métiers","secondaryRole":"14 ans en réseau d’optique · Organisation & process · Outils d’aide à la décision · Pilotage par la donnée","intro":"Après 14 ans sur le terrain commercial, j’ai orienté mon parcours vers ce qui me motive le plus : organiser l’activité, écrire les procédures et donner à la direction les moyens de piloter, en construisant les outils qui manquaient quand il le fallait.","a4":{"targetRole":"Coordinateur performance & organisation","positioning":["Structuration de l’activité","Process","Outils métiers","Pilotage par la donnée"],"experience":"14 ans d’expérience en environnement commercial"},"site":{"host":"j-rbs91.github.io/CV_interactif_Jeremy_Ribes","url":"https://j-rbs91.github.io/CV_interactif_Jeremy_Ribes/"},"portrait":{"src":"./assets/img/portrait/me.jpg","width":405,"height":405},"items":[{"icon":"pin","text":"Montferrier-sur-Lez (34)"},{"icon":"mail","text":"Me contacter","type":"contact-form"}]},"profile":{"quote":"Rendre une activité plus lisible et plus facile à piloter, sans l’alourdir.","intro":"J’ai \u003cstrong>progressivement élargi mon rôle de la vente à l’organisation de l’activité\u003c/strong> : procédures, suivi des dossiers, plannings, accompagnement de l’équipe et indicateurs de pilotage. Cette part de mon travail, d’abord secondaire, est devenue centrale, et j’ai construit les outils qui manquaient pour la tenir.","cards":[{"title":"Positionnement","nature":"cadre","text":"Je fais le lien entre la direction, qui fixe les objectifs, et l’équipe, qui vit les contraintes du quotidien. Je traduis les objectifs en méthodes applicables, et je fais remonter à la direction ce que le terrain voit et qu’elle ne voit pas."},{"title":"Méthode","nature":"produit","text":"\u003cstrong>Je pars d’un problème précis\u003c/strong> (une ressaisie, un oubli, un calcul refait à la main) et je cherche d’où il vient. \u003cstrong>Puis je choisis la réponse\u003c/strong> : changer une pratique, nommer un responsable, supprimer une étape ou, si cela ne suffit pas, créer l’outil qui manque. Je n’attends pas qu’on me le demande, et je vérifie dès la première utilisation que la réponse fonctionne."}],"expertise":"\u003cstrong>Concevoir les outils et les procédures qui manquent\u003c/strong> pour piloter une activité, et supprimer le travail refait à la main.","contributionTags":[{"label":"Procédures écrites","nature":"cadre"},{"label":"Outils de suivi","nature":"produit"},{"label":"Tableaux de pilotage","nature":"produit"},{"label":"Contrôles automatisés","nature":"produit"},{"label":"Organisation d’équipe","nature":"cadre"},{"label":"Conduite du changement","nature":"cadre"}],"target":"\u003cstrong>Un rôle transverse dédié à l’organisation de l’activité\u003c/strong>, sur des fonctions organisation, process ou outils métiers. Je vise ce type de poste dans un réseau commercial, un service client, ou une entreprise en croissance soumise à de fortes contraintes opérationnelles."},"formation":{"year":"2012","title":"BTS Opticien Lunetier","subtitle":"Diplôme professionnel · Optique","a4Note":"En autodidacte : process, data, automatisation.","continuousSkills":[{"title":"Formalisation de process","nature":"cadre","text":"Procédures de back-office et guides de traitement, priorisés selon le modèle de Kano."},{"title":"Attribution des responsabilités","nature":"cadre","text":"Nommer qui traite quoi, et pour quand. Une tâche sans responsable n’est traitée par personne : le brief quotidien et le suivi des devis règlent ce problème."},{"title":"Indicateurs avancés & retardés","nature":"produit","text":"Distinguer les chiffres qui constatent un résultat de ceux sur lesquels on peut encore agir (délais, relances, dossiers à risque). C’est la logique de PANUM."},{"title":"Analyse de données & modélisation","nature":"produit","text":"Indicateurs causaux (PANUM), modèles de croissance thermique (L’Ortabels), régressions de prix (Renta Menu)."},{"title":"Google Apps Script","nature":"produit","text":"Développement des outils internes présentés en section Outils."},{"title":"Développement web & desktop","nature":"produit","text":"Hub d’outils magasin, interfaces d’aide à la vente, application de suivi commercial."},{"title":"Mise en production","nature":"cadre","text":"Environnements, contrôles qualité et déploiements automatisés sur KuT, PANUM et L’Ortabels."}],"quote":"J’apprends à partir des problèmes que je rencontre sur le terrain."},"experiences":[{"id":"krys","detailLabel":"Le système de pilotage","role":"Opticien collaborateur","company":"Krys","date":"2025 → aujourd’hui","recency":"now","context":"En plus de la vente, j’ai pris en charge une part croissante de l’organisation et de l’outillage du magasin.","bullets":["Mise en place d’un système de pilotage reliant suivi des devis et du tiers payant, prochaine action, charge par collaborateur et brief quotidien. Les outils s’alimentent entre eux : les dossiers à reprendre deviennent des priorités visibles, puis des actions attribuées à chacun. La direction voit où l’activité bloque et qui doit agir.","Contrôles automatisés des saisies dans le suivi des devis, et comparaison avec le logiciel métier pour repérer les dossiers non suivis et mesurer l’écart.","Méthode de back-office éprouvée chez Générale d’Optique, défendue auprès de la direction et de l’équipe en place jusqu’à son adoption : procédures de contrôle des commandes, de dispatch et de traitement des retards, vérifications à J+1, rendez-vous de livraison lissés sur la semaine.","Outillage des tâches courantes du magasin, regroupées en un point d’entrée unique pour supprimer les ressaisies et uniformiser les documents produits.","Conception et envoi d’une campagne e-mail sur une base de plus de mille clients segmentée, consentements vérifiés avant envoi, 96,5 % de délivrabilité. Attribution suivie jusqu’à la prise de rendez-vous en magasin."],"a4Summary":"Organisation back-office · outils métiers · suivi de l’activité · procédures · optimisation des flux","result":"Trois outils utilisés chaque jour par l’équipe : suivi des devis, brief quotidien et hub d’outils du magasin. Les deux premiers, conçus dans mon poste précédent, ont été repris ici parce qu’ils servaient, sans que personne ne les ait demandés."},{"id":"generale-optique","detailLabel":"La reprise du magasin","role":"Responsable de magasin","company":"Générale d’Optique","date":"2024 → 2025","recency":"recent","context":"Reprise d’un magasin en difficulté : relance commerciale, réorganisation du fonctionnement quotidien et constitution de l’équipe.","bullets":["Rédaction de l’offre d’emploi, conduite des entretiens et formation des deux collaborateurs recrutés.","Stratégie de présence locale proposée et mise en place : actions ciblées, référencement local et collecte d’avis Google.","Formalisation des procédures de contrôle, de dispatch et de traitement des retards. Refonte des horaires et des règles de présence pour aligner les effectifs sur la charge réelle.","Instauration d’un brief de début de journée et d’un suivi commun des devis : tâches de back-office attribuées nommément, dossiers à reprendre visibles de toute l’équipe.","Conception d’Opti’Profit, un outil d’aide à la décision qui croise besoin technique, budget du client, réseau de soins, prix de vente et coût d’achat pour ne proposer que des solutions compatibles et préserver la marge. Pendant la vente, le prix final, la remise et la marge s’affichent immédiatement, ce qui permet d’ajuster l’offre sur place."],"a4Summary":"Redynamisation commerciale · organisation du point de vente · recrutement et formation · conception d’outils","statsLabel":"Sur les deux mois qui ont suivi, ces actions ont contribué à","stats":[{"value":"+83 % CA"},{"value":"+5,6 pts","label":"de marge"}],"statsBase":"Écarts mesurés par rapport à la moyenne des seize mois précédents.","result":"Réorganisation et implication saluées par la direction régionale. Le brief quotidien et le suivi des devis conçus pour ce poste sont aujourd’hui utilisés par mon équipe, dans une autre enseigne."},{"id":"terrain","detailLabel":"Onze ans, trois organisations","role":"Opticien collaborateur","company":"GrandOptical · Krys · Lissac","date":"2012 → 2023","recency":"past","context":"Onze ans en magasin, dans trois enseignes.","bullets":["Vente conseil et traitement des dossiers complexes : contraintes techniques, réseaux de soins, tiers payant.","Trois façons différentes d’organiser un magasin, vécues de l’intérieur : c’est là que j’ai appris ce qui fonctionne vraiment en point de vente.","Bascule progressive vers les sujets d’organisation : méthodes de travail, fiabilisation des calculs récurrents et du suivi des dossiers."],"a4Summary":"Onze ans de terrain, trois enseignes, trois organisations : vente, dossiers complexes, puis organisation et fiabilisation des méthodes."}],"outils":[{"id":"optiprofit","title":"Opti’Profit","category":"Aide à la décision commerciale","nature":"produit","status":"Transmis à la demande du directeur régional GrandVision","detailLabel":"Pourquoi pas une formation","chips":["Arbitrage en vente","Réseaux de soins","Rentabilité","Temps réel","Google Apps Script"],"summary":"Outil utilisé pendant la vente pour trouver le meilleur compromis entre besoin technique, budget du client et marge du magasin.","context":"Le bon produit dépend du besoin technique, du budget, des contraintes du réseau de soins et de la marge. L’information est répartie entre les catalogues fournisseurs et les grilles tarifaires des mutuelles, et la décision se prend en quelques secondes, avec le client en face.","arbitrage":"Une formation ou une grille écrite ne suffisaient pas : les catalogues et les accords changent souvent, et ce qu’on apprend à l’avance est oublié ou dépassé au moment de vendre. J’ai donc choisi d’apporter l’information au moment de la vente, au lieu de demander au vendeur de la retenir.","action":"Rassemblement des catalogues fournisseurs et des grilles mutuelles en une source unique, filtrage des produits compatibles avec le besoin et le budget, et mise en évidence de l’écart de marge entre deux solutions équivalentes pour le client. Développé sous Google Apps Script.","results":"Les vendeurs n’ont plus eu à comparer les catalogues devant le client, et le choix du produit est devenu clair au moment de la vente. Utilisé pendant toute la durée de mon poste. Conçu sur mon temps personnel, l’outil m’appartient. Je l’ai transmis à la demande du directeur régional de GrandVision, qui l’envisageait pour le réseau de magasins franchisés de la Générale d’Optique."},{"id":"briefmaker","title":"Brief’Maker","category":"Organisation quotidienne du magasin","nature":"produit","status":"En usage quotidien depuis sa conception","detailLabel":"Nommer qui fait quoi","chips":["Coordination d’équipe","Attribution des tâches","Priorisation","Back-office","Agrégation","Agenda Google"],"summary":"Le brief du début de journée : planning, agenda et dossiers en cours sur une seule vue, et les tâches réparties nommément entre les collaborateurs.","context":"L’information se perdait d’une équipe à l’autre, et les tâches de back-office n’apparaissaient nulle part : chaque équipe pensait que l’autre s’en était occupée. Il en résultait des oublis, et une vision floue de l’activité pour la direction.","arbitrage":"Il fallait d’abord un moment dans la journée où chaque tâche est attribuée à quelqu’un. C’est cette décision qui résout le problème. Mais aucun responsable n’allait rassembler quatre sources d’information à la main chaque matin : c’est pour cela qu’un outil est devenu nécessaire.","action":"Une feuille de brief qui rassemble automatiquement les informations du jour (planning de l’équipe, rendez-vous de l’agenda, suivi des dossiers, devis et tiers payant), puis attribue les tâches à chaque collaborateur et permet de saisir les indicateurs et les informations managériales.","results":"Utilisé chaque jour dans le magasin où je travaille aujourd’hui. Personne ne l’avait demandé : l’équipe l’a adopté parce qu’il lui servait."},{"id":"hub-opticien","title":"Hub Outils Opticien","category":"Outillage du quotidien en magasin","nature":"produit","status":"En usage quotidien en magasin","detailLabel":"Supprimer la ressaisie","chips":["Tâches récurrentes","Fiabilisation des calculs","Standardisation","Données locales","Application web"],"liveProduct":false,"link":{"label":"Découvrir le hub","url":"https://j-rbs91.github.io/Hub_Tools_N_Templates/"},"summary":"Un point d’entrée unique pour les tâches courtes et répétées du magasin (demande au médecin, clôture de caisse, calcul d’épaisseur), paramétrées une fois et utilisables sans formation.","context":"Ces tâches s’appuyaient sur des documents dispersés, des calculs refaits à la main et les mêmes informations ressaisies chaque fois. Chacune paraît mineure, mais répétées chaque jour, elles prennent du temps et laissent passer des erreurs.","arbitrage":"Une procédure n’aurait rien changé : les collaborateurs travaillaient bien, c’est la tâche qui était mal outillée. Un mode opératoire aurait ajouté une lecture à une tâche de deux minutes, et personne ne l’aurait suivi. J’ai préféré ne rien demander de plus à l’équipe et supprimer la ressaisie, ce qui supprime aussi les écarts entre collaborateurs.","action":"Regroupement de ces usages en un point d’entrée unique : demandes et comptes rendus au médecin normalisés avec export PDF et envoi par mail, clôture de caisse reprenant le comptage de la veille et contrôlant l’écart avec le logiciel métier, calcul d’épaisseur et de décentrement avec représentation à l’échelle 1:1 du verre taillé et monté. Les coordonnées du magasin sont saisies une fois et alimentent tous les outils ; les données restent sur le poste, sans transmission serveur.","results":"En service dans le magasin : les documents sont identiques quel que soit le collaborateur qui les produit, et les calculs récurrents ne se refont plus à la main."},{"id":"suivi-devis","title":"Suivi des devis & tiers payant","category":"Suivi commercial en magasin","nature":"produit","status":"En usage quotidien par toute l’équipe","detailLabel":"Ce que l’équipe saisit","chips":["Suivi de dossiers","Tiers payant","Relances","Google Apps Script"],"summary":"Suivi partagé qui tient chaque devis de son édition à sa conclusion : statut du tiers payant, prochaine action datée, motif de perte et historique des échanges avec le client.","context":"Un devis se perd rarement d’un coup : il traîne. Il manque une pièce, l’accord de prise en charge n’aboutit pas, ou personne ne fait la relance. Sans suivi commun, chacun redécouvre le dossier à chaque fois, et le magasin ne sait ni ce qu’il perd, ni pourquoi.","arbitrage":"Avant de construire quoi que ce soit, il fallait décider à partir de quand un dossier devient à risque, qui en est responsable, et surtout ce que l’équipe accepterait de saisir. Un suivi plus détaillé aurait été plus précis, mais personne ne l’aurait rempli. J’ai choisi le niveau de détail que l’équipe peut tenir au quotidien.","action":"Matérialisation de ces règles en un suivi partagé : neuf statuts de tiers payant, plateforme et mutuelle, date de prochaine action, motif de blocage ou de perte, profil d’achat, collaborateur en charge, et historique daté des échanges avec le client.","results":"Rempli chaque jour par l’équipe, sans que personne ait eu à l’imposer. Ses colonnes ont servi de base à PANUM : statuts de financement, motifs, profils d’achat et historiques y sont repris tels quels."},{"id":"panum","title":"PANUM","category":"Suivi commercial & pilotage de la performance","nature":"produit","status":"Abouti · en attente de déploiement pilote","detailLabel":"Pourquoi quitter le tableur","chips":["Priorisation des relances","Causes de perte","Périmètres de visibilité","Aide à la décision"],"link":{"label":"Découvrir PANUM","url":"https://panum.fr/"},"summary":"Solution de suivi commercial et de pilotage de la performance : centraliser les dossiers, prioriser les relances et rendre visibles les causes de sous-performance.","context":"Le suivi des devis et du tiers payant repose souvent sur des pratiques hétérogènes. Résultat : des dossiers qui stagnent, des relances oubliées, et un management qui ne sait pas précisément pourquoi les ventes se perdent.","arbitrage":"Le suivi partagé fonctionnait pour l’équipe, mais pas pour piloter un réseau. Un tableur ne permet pas de donner à chacun une vue adaptée à son niveau hiérarchique, ni de garder l’historique d’un blocage pour en comprendre la cause. Il fallait donc un vrai logiciel, construit autour des responsabilités de chaque niveau.","action":"Modélisation de la hiérarchie d’un réseau direction, management, collaborateurs avec les périmètres de visibilité correspondants, historisation des épisodes de blocage pour en mesurer les causes, et traitement des données personnelles intégré dès la conception.","results":"Le produit est terminé et testé. Le déploiement pilote en magasin servira à valider la priorisation sur des données réelles ; il attend la création de la structure juridique qui permettra de signer avec les points de vente."},{"id":"planning","title":"Gestionnaire de Planning","category":"Planification des effectifs","nature":"produit","status":"Resté en service après mon départ","detailLabel":"Revoir les horaires","chips":["Charge et effectifs","Contraintes d’ouverture","Planification","Ressources","Flux client"],"summary":"Outil de construction de planning alignant les effectifs présents sur la charge réelle et les contraintes d’ouverture du point de vente.","context":"On attribuait les tensions d’organisation aux personnes. Elles venaient en fait d’un décalage entre les effectifs présents, la charge de travail et les contraintes d’ouverture du magasin.","arbitrage":"La vraie décision était de revoir les règles : horaires d’ouverture, plages de présence et répartition des créneaux. L’outil ne décide rien à la place du responsable : il permet d’appliquer ces règles chaque semaine, au lieu de tout refaire de tête et de renégocier chaque planning.","action":"Développement d’un outil de construction de planning ajustant les effectifs à l’activité attendue à partir des contraintes d’exploitation du point de vente.","results":"Les conflits d’organisation récurrents ont cessé pendant la durée de mon poste, et le coût du personnel s’est aligné sur le flux réel. Après mon départ, un collaborateur l’a repris pour construire ses plannings. Une version simplifiée, qui affiche le planning type selon la date, est intégrée à Brief’Maker pour montrer le planning du jour."}],"projets":[{"id":"kut","short":"KuT","title":"KuT : logiciel de gestion pour salons et activités de bien-être","subtitle":"Conception produit & pilotage · en ligne, développement continu","bullets":["Traduction des besoins d’un salon à prestations récurrentes en parcours, règles métier et fonctionnalités : clients, réservations, planning, fidélité, campagnes commerciales et indicateurs. Module de caisse et exports comptables en cours.","Écriture des règles métier, des cas limites et des plans de tests, pour vérifier de façon fiable le comportement des fonctions sensibles.","Pilotage du projet : cadrage fonctionnel, priorisation des évolutions, validation des usages et préparation du déploiement."],"link":{"label":"Découvrir KuT","url":"https://kut.panum.fr/"},"transferableSkills":[{"title":"Conception produit","nature":"produit","text":"Partir d’un besoin métier réel et le traduire en parcours, règles fonctionnelles et priorités claires."},{"title":"Sécurisation fonctionnelle","nature":"cadre","text":"Écrire les règles et les cas limites avant le code, pour pouvoir vérifier ensuite que tout fonctionne comme prévu."}]},{"id":"ortabels","short":"L’Ortabels","title":"L’Ortabels : projet maraîcher et outil d’aide à la décision","subtitle":"Modélisation agronomique · en ligne, développement continu","bullets":["Le développement d’une culture dépend de la chaleur accumulée (les degrés-jours), et non du nombre de semaines écoulées. Le calendrier seul ne suffit donc pas pour planifier.","Conception d’un outil exploitant les températures locales, les degrés-jours et les modèles de croissance thermique pour estimer les fenêtres de semis, les stades de développement et les périodes de récolte.","Structuration du projet maraîcher lui-même : planification des cultures, organisation des rotations et suivi des séries."],"link":{"label":"Découvrir L’Ortabels","url":"https://app.ortabels.fr/"},"transferableSkills":[{"title":"Modèles prédictifs","nature":"produit","text":"Transformer des données brutes en dates concrètes pour décider quand semer et quand récolter."},{"title":"Organisation","nature":"cadre","text":"La même logique qu’un back-office bien organisé : planifier les étapes et rendre visible ce qui doit être fait."}]},{"id":"renta-menu","short":"Renta Menu","title":"Renta Menu : pilotage de la rentabilité en restauration","subtitle":"Outil décisionnel · Rentabilité en restauration","bullets":["Modélisation du coût matière par composante de menu et calcul automatisé des marges brutes.","Détermination des prix de vente par régression (linéaire inverse et logarithmique), à partir du coût et de l’élasticité observée.","Calcul du besoin en effectifs et du coût employeur réel selon le volume de couverts prévisionnel.","Seuil de rentabilité, marge nette par couvert et projections de résultat calculés en continu."],"transferableSkills":[{"title":"Analyse de données","nature":"produit","text":"Rassembler des données de sources différentes pour en tirer des indicateurs utilisables tout de suite."},{"title":"Rentabilité","nature":"produit","text":"Trouver comment protéger la marge sans changer le positionnement de l’établissement."}]}],"competences":[{"id":"pilotage-commercial","title":"Pilotage commercial & rentabilité","summary":"Développer le flux clients en tenant la marge sur chaque vente.","nature":"produit","detailLabel":"Relancer sans remise","tags":["Flux clients","Marge","Référencement local"],"enjeu":"Relancer un magasin en difficulté sans acheter le chiffre par la remise.","miseEnPlace":"J’ai travaillé deux leviers en parallèle. Pour faire venir des clients : actions locales ciblées, référencement local et collecte d’avis Google. Pour préserver la marge de chaque vente : un outil d’aide au choix du produit, utilisé pendant la vente.","exemple":"L’outil fait ressortir le mix produit le plus pertinent selon le budget du client, les contraintes techniques, les offres en cours et les réseaux de soins.","resultat":"Chez Générale d’Optique, ces actions ont contribué à +83 % de chiffre d’affaires et +5,6 points de marge sur les deux mois qui ont suivi, mesurés par rapport à la moyenne des seize mois précédents.","a4Rank":3,"a4Statement":"Développer l’activité tout en maintenant la qualité économique des ventes.","a4Proofs":["Actions commerciales locales","Trafic et marge travaillés ensemble","Arbitrage produit en situation de vente"]},{"id":"organisation-process","title":"Organisation & formalisation des process","summary":"Transformer des pratiques implicites en procédures écrites et réellement utilisées.","nature":"cadre","detailLabel":"Répartir la charge","tags":["Procédures","Back-office","Nivellement de charge","Priorisation"],"enjeu":"Éviter les oublis et les « qui s’en occupe ? » du quotidien.","miseEnPlace":"Procédure de contrôle et de dispatch back-office, priorisation des dossiers complets et incomplets, organisation J+1 des montages et vérifications, cadrage des rendez-vous de livraison. Je priorise selon une logique inspirée du modèle de Kano : sécuriser d’abord ce qui crée de l’insatisfaction quand c’est absent, renforcer ensuite ce qui améliore l’expérience.","exemple":"Un même principe appliqué deux fois : \u003cstrong>répartir la charge au lieu de subir le pic\u003c/strong>. Les rendez-vous de livraison étalés sur la semaine ont supprimé la surcharge du samedi, et les plannings construits sur l’activité prévue ont ajusté les effectifs au flux de clients.","a4Rank":1,"a4Statement":"Transformer les pratiques implicites en méthodes claires et utilisables.","a4Proofs":["Procédures de contrôle, dispatch, retards","Vérifications en J+1","Livraisons lissées sur la semaine","Plannings construits sur l’activité attendue"]},{"id":"outils-metiers","title":"Conception d’outils métiers","summary":"Concevoir et développer moi-même les outils qui manquent à l’activité.","nature":"produit","detailLabel":"Partir de l’usage","tags":["Problème observé","Adoption sans formation","Google Apps Script","Web","Automatisation"],"enjeu":"Donner au terrain des repères concrets quand la bonne décision dépend de plusieurs contraintes à la fois.","miseEnPlace":"Je conçois et je développe moi-même, sous Google Sheets et Apps Script comme en web : arbitrage produit en vente, calcul de dégression de verres techniques, suivi des devis et du tiers payant, brief quotidien, planification des effectifs, hub d’outils du magasin.","exemple":"Je conçois chaque outil à partir de ce que je vois l’équipe faire au quotidien, et je le veux utilisable sans formation : sinon, il n’est pas utilisé.","a4Rank":2,"a4Statement":"Concevoir des outils qui sécurisent une décision et suppriment les ressaisies.","a4Proofs":["Opti’Profit : arbitrage produit et marge","Brief’Maker : planning, dossiers, tâches","Suivi devis & tiers payant : statut et relance","Hub magasin : calculs et documents standardisés"]},{"id":"pilotage-donnee","title":"Pilotage par la donnée","summary":"Concevoir des indicateurs qui expliquent la performance et montrent où agir.","nature":"produit","detailLabel":"Constater ou agir","tags":["Indicateurs avancés","Contrôles automatisés","Reporting"],"enjeu":"Montrer où agir avant que le résultat soit joué.","miseEnPlace":"Je sépare les \u003cstrong>indicateurs retardés\u003c/strong>, qui constatent un résultat déjà joué, des \u003cstrong>indicateurs avancés\u003c/strong>, sur lesquels on peut encore agir : délais de traitement, discipline de relance, dossiers à risque, pertes évitables et santé du portefeuille. J’ai également mis en place des contrôles automatisés rapprochant le logiciel métier et les suivis internes.","exemple":"C’est la logique de PANUM : comprendre pourquoi une vente se perd, et quoi faire en priorité.","resultat":"Ces contrôles ont fait apparaître des dossiers absents des suivis internes, qui échappaient jusque-là au pilotage. Ils vérifient aussi mon propre outil : un dossier oublié dans le suivi des devis est repéré.","a4Rank":4,"a4Statement":"Construire des indicateurs qui montrent où agir.","a4Proofs":["Indicateurs avancés séparés des retardés","Délais, relances, dossiers à risque","Rapprochement automatisé de deux sources","PANUM : causes de sous-performance"]},{"id":"coordination-changement","title":"Coordination & conduite du changement","summary":"Traduire des objectifs en méthodes de travail que l’équipe accepte.","nature":"cadre","detailLabel":"Faire adopter","tags":["Direction","Terrain","Adhésion"],"enjeu":"Faire adopter des méthodes dans des environnements où tout ce qui ajoute de la complexité est rejeté d’office.","miseEnPlace":"Je présente chaque nouvelle méthode par ce qu’elle retire du travail de l’équipe : moins d’oublis, moins de ressaisie, une charge mieux répartie. C’est ce gain immédiat qui la fait adopter.","exemple":"Suivis quotidiens et procédures de back-office adoptés par les équipes, dans deux enseignes différentes.","resultat":"Chez Générale d’Optique, la réorganisation et mon implication ont été saluées par la direction régionale.","a4Rank":5,"a4Statement":"Relier les objectifs de la direction aux contraintes concrètes des équipes.","a4Proofs":["Tâches et responsabilités nominatives","Brief quotidien commun à l’équipe","Deux collaborateurs recrutés et formés","Méthodes adoptées dans deux enseignes"]}]};

<script>
const $ = (s) => document.querySelector(s);
const C = window.CV, P = C.profile;
const pad = (n) => String(n + 1).padStart(2, "0");
const live = [...C.outils.filter((o) => o.link && o.liveProduct !== false).map((o) => ({ n: o.title, ...o.link })), ...C.projets.filter((p) => p.link).map((p) => ({ n: p.short, ...p.link }))];
const host = (u) => new URL(u).host.replace(/^www\./, "");

$("#brand").textContent = C.contact.name;
$("#cta").href = C.contact.site.url;
const nav = [["Parcours", "parcours"], ["Outils", "outils"], ["Projets", "projets"], ["Compétences", "competences"], ["Formation", "formation"]];
$("#nav").innerHTML = nav.map(([l, id]) => `<a href="#${id}">${l}</a>`).join("");
$("#foot").textContent = `${C.contact.name} — ${C.contact.items[0].text}`;
$("#foot2").textContent = C.contact.site.host;

const hero = `
<section class="card hero c8">
  <span class="mono">Profil · Positionnement & méthode</span>
  <h1>${P.quote}</h1>
  <p class="lead">${P.intro}</p>
  <div class="facts">${P.cards.map((c) => `<div class="fact"><b>${c.title}</b><p>${c.text}</p></div>`).join("")}<div class="fact"><b>Expertise clé</b><p>${P.expertise}</p></div></div>
</section>
<aside class="card me c4">
  <img src="${window.PHOTO}" alt="Portrait de ${C.contact.name}" />
  <h3>${C.contact.name}</h3>
  <span class="mono">${C.contact.role}</span>
  <p class="sub">${C.contact.secondaryRole.split(" · ").join(" · ")}</p>
  <div class="links">${live.map((l) => `<a href="${l.url}"><div><b>${l.n}</b><span>${host(l.url)}</span></div><span>↗</span></a>`).join("")}<a href="${C.contact.site.url}"><div><b>Me contacter</b><span>Formulaire, sur le site</span></div><span>→</span></a></div>
</aside>`;

const exp = `<section class="card list c7" id="parcours"><h2>Parcours<small>${C.experiences.length} postes · 14 ans</small></h2>${C.experiences.map((e) => {
  const stats = e.stats ? `<div class="proof">${e.stats.map((s) => `<div>${s.value}${s.label ? `<small>${s.label}</small>` : ""}</div>`).join("")}</div><p class="mono" style="text-transform:none;letter-spacing:.02em">${e.statsLabel} — ${e.statsBase}</p>` : "";
  return `<details><summary><span class="t">${e.company}</span><span class="d mono">${e.date}</span><span class="r">${e.role}</span></summary><div class="body">${e.context ? `<p>${e.context}</p>` : ""}<ul>${e.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>${stats}${e.result ? `<p><b style="color:var(--ink)">${e.result}</b></p>` : ""}</div></details>`;
}).join("")}</section>`;

const proofs = C.experiences.find((e) => e.stats);
const stat = `<section class="card c5" style="display:flex;flex-direction:column;justify-content:space-between"><h2>Preuve<small>mesurée</small></h2><div class="proof" style="font-size:clamp(40px,5vw,64px);flex-direction:column;gap:18px">${proofs.stats.map((s) => `<div>${s.value}${s.label ? `<small>${s.label}</small>` : ""}</div>`).join("")}</div><p style="font-size:13px;color:var(--ink2);margin-top:22px">${proofs.statsLabel} — ${proofs.statsBase}</p></section>`;

const tools = `<section class="card c12" id="outils"><h2>Outils<small>conçus, déployés, en usage</small></h2><div class="tools">${C.outils.map((o, i) => `<article class="tool"><span class="n">${pad(i)}</span><h3>${o.title}</h3><span class="mono">${o.category}</span><p>${o.summary}</p><details><summary>${o.detailLabel} ＋</summary><div class="more"><div><b>Situation.</b> ${o.context}</div>${o.arbitrage ? `<div><b>Décision.</b> ${o.arbitrage}</div>` : ""}<div><b>Réponse.</b> ${o.action}</div><div><b>Résultat.</b> ${o.results}</div><div class="chips">${o.chips.map((c) => `<span>${c}</span>`).join("")}</div></div></details><span class="st">${o.status}</span></article>`).join("")}</div></section>`;

const prj = `<section class="card list c12" id="projets"><h2>Projets transverses<small>${C.projets.length}</small></h2>${C.projets.map((p, i) => `<details><summary><span class="t">${p.short}</span><span class="d mono">${pad(i)}</span><span class="r">${p.subtitle}</span></summary><div class="body"><ul>${p.bullets.map((b) => `<li>${b}</li>`).join("")}</ul><div class="mono lab">Compétences transférables</div><ul>${p.transferableSkills.map((t) => `<li><b style="color:var(--ink)">${t.title}</b> — ${t.text}</li>`).join("")}</ul>${p.link ? `<p><a style="font-weight:800;text-decoration:underline" href="${p.link.url}">${p.link.label} ↗</a></p>` : ""}</div></details>`).join("")}</section>`;

const comp = `<section class="card list c7" id="competences"><h2>Compétences<small>${C.competences.length} domaines</small></h2>${C.competences.map((c) => `<details><summary><span class="t" style="font-size:clamp(17px,1.8vw,23px)">${c.title}</span><span class="r">${c.summary}</span></summary><div class="body"><div class="mono lab">Enjeu traité</div><p>${c.enjeu}</p><div class="mono lab">Ce que j’ai mis en place</div><p>${c.miseEnPlace}</p><div class="mono lab">Exemple concret</div><p>${c.exemple}</p><div class="mono lab">Résultat observable</div><p>${c.resultat}</p><div class="chips">${c.tags.map((t) => `<span>${t}</span>`).join("")}</div></div></details>`).join("")}</section>`;

const f = C.formation;
const form = `<section class="card c5 skills" id="formation"><h2>Formation<small>${f.year}</small></h2><div style="font:800 22px/1.15 var(--disp);font-stretch:125%;letter-spacing:-.02em">${f.title}</div><p class="mono" style="margin:6px 0 18px">${f.subtitle}</p>${f.continuousSkills.map((s) => `<a><span><b>${s.title}</b><small>${s.text}</small></span></a>`).join("")}<p style="margin-top:16px;font-weight:700">${f.quote}</p></section>`;

$("#main").innerHTML = hero + exp + stat + tools + prj + comp + form;

/* La lueur sous le pointeur : deux propriétés par image, souris seulement. */
if (matchMedia("(hover:hover) and (pointer:fine)").matches) document.querySelectorAll(".card").forEach((c) => {
  let raf = 0;
  c.addEventListener("pointermove", (e) => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; const b = c.getBoundingClientRect(); c.style.setProperty("--mx", e.clientX - b.left + "px"); c.style.setProperty("--my", e.clientY - b.top + "px"); }); });
});
</script>
</body>
</html>
