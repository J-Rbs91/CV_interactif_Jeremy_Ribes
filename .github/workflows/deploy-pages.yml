# Déploiement GitHub Pages piloté par le dépôt.
#
# Auparavant, Pages utilisait le workflow géré par GitHub
# (`dynamic/pages/pages-build-deployment`), qui n'existe pas dans le dépôt et
# ne peut donc pas être mis à jour : ses actions internes tournaient encore sur
# Node 20, d'où l'avertissement de dépréciation à chaque build. Le déclarer ici
# rend les versions d'actions maîtrisables, et supprime au passage un build
# Jekyll dont un site statique n'a aucun besoin.
#
# Prérequis côté dépôt : Settings → Pages → Build and deployment → Source =
# « GitHub Actions ». Sans ce réglage, l'étape de déploiement échoue.

name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois, sans annuler celui en cours : une publication
# interrompue laisserait le site dans un état partiel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # La page principale utilise désormais le contenu statique de la
      # maquette validée. Les modules de l'ancien CV ne sont plus publiés.
      - name: Qualifier les fichiers du CV publié
        run: |
          npm run check:site
          node --check js/cv-root.js
          node --check maquette-positionnement/maquette.js
          node --check js/ui/contactForm.js
          node --check js/ui/backNavigation.js

      # Liste explicite plutôt que la racine entière : la documentation de
      # travail (`AGENTS.md`, `docs/`, `skills-lock.json`, `.agents/`,
      # `.claude/`, `scripts/`, `package.json`) n'a pas à être publiée avec le
      # CV.
      - name: Assembler le site à publier
        run: |
          mkdir -p _site/css _site/js/ui
          cp index.html cv-a4.html robots.txt sitemap.xml _site/
          cp css/base.css css/site.css css/panels.css css/cv-print.css css/cv-a4.css _site/css/
          cp js/cv-root.js _site/js/
          cp js/ui/intro.js js/ui/contactForm.js js/ui/backNavigation.js _site/js/ui/
          cp -r assets _site/
          # La version de travail reste disponible pour comparaison.
          cp -r maquette-positionnement _site/

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
